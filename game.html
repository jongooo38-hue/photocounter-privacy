<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Super Penguin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Arial Rounded MT Bold',Arial,sans-serif}
#wrap{position:relative;width:360px;height:640px}
canvas{display:block}
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none}
#livesBox{position:absolute;top:10px;left:10px;font-size:22px;text-shadow:0 1px 3px #000}
#distBox{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:bold;color:#fff;text-shadow:0 2px 4px #000}
#bestBox{position:absolute;top:38px;left:50%;transform:translateX(-50%);font-size:13px;color:#ffe080;text-shadow:0 1px 3px #000}
#fishBox{position:absolute;top:10px;right:10px;font-size:20px;color:#ff9900;text-shadow:0 1px 3px #000}
#boostBox{position:absolute;top:72px;left:50%;transform:translateX(-50%);font-size:13px;color:#80ffff;text-shadow:0 1px 3px #000}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,30,80,.88)}
#overlay h1{color:#fff;font-size:36px;text-shadow:0 2px 8px #0af;margin-bottom:8px}
#overlay p{color:#aef;font-size:14px;margin-bottom:24px;text-align:center;padding:0 20px}
#overlay button{padding:14px 40px;font-size:18px;border:none;border-radius:30px;background:linear-gradient(135deg,#0af,#08f);color:#fff;cursor:pointer;margin:6px;box-shadow:0 4px 12px rgba(0,120,255,.5)}
#overlay button:active{transform:scale(.96)}
#gyroBtn{display:none}
#gameoverPanel{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,40,.88)}
#gameoverPanel h2{color:#ff4444;font-size:32px;text-shadow:0 2px 8px #f00;margin-bottom:12px}
#gameoverPanel .score{color:#fff;font-size:18px;margin:4px}
#gameoverPanel button{padding:12px 36px;font-size:16px;border:none;border-radius:24px;background:linear-gradient(135deg,#0af,#08f);color:#fff;cursor:pointer;margin-top:16px;box-shadow:0 4px 12px rgba(0,120,255,.5)}
#settingsBtn{position:absolute;bottom:18px;right:14px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:22px;width:40px;height:40px;border-radius:50%;cursor:pointer;z-index:10;display:none}
#settingsPanel{position:absolute;bottom:64px;right:14px;background:rgba(10,20,60,.95);border:1px solid rgba(0,150,255,.4);border-radius:14px;padding:14px 18px;display:none;z-index:20;width:220px}
#settingsPanel h3{color:#8cf;font-size:15px;margin-bottom:10px}
.srow{display:flex;align-items:center;justify-content:space-between;margin:7px 0;color:#cdf;font-size:13px}
.srow input[type=range]{width:110px;accent-color:#0af}
.diff-btn{padding:4px 10px;border:1px solid #0af;border-radius:10px;background:transparent;color:#0af;font-size:12px;cursor:pointer;margin-left:3px}
.diff-btn.active{background:#0af;color:#000}
#settingsClose{display:block;margin:10px auto 0;padding:5px 20px;border:1px solid #0af;border-radius:10px;background:transparent;color:#0af;font-size:13px;cursor:pointer}
#inkOverlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(20,0,40,.0);pointer-events:none;transition:background .3s}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="640"></canvas>
  <div id="hud">
    <div id="livesBox">❤️❤️❤️</div>
    <div id="distBox">0m</div>
    <div id="bestBox">Best: 0m</div>
    <div id="fishBox">🐟 0</div>
    <div id="boostBox"></div>
  </div>
  <div id="inkOverlay"></div>
  <div id="overlay">
    <h1>🐧 Super Penguin</h1>
    <p>기울여서 좌우 이동<br>탭/스페이스 = 점프</p>
    <button id="startBtn">시작!</button>
    <button id="gyroBtn">자이로 허용 📱</button>
  </div>
  <div id="gameoverPanel">
    <h2>Game Over</h2>
    <div class="score" id="goDistTxt"></div>
    <div class="score" id="goFishTxt"></div>
    <div class="score" id="goBestTxt"></div>
    <button id="restartBtn">다시 시작</button>
  </div>
  <button id="settingsBtn">⚙️</button>
  <div id="settingsPanel">
    <h3>⚙️ 설정</h3>
    <div class="srow"><span>자이로 민감도</span><input type="range" id="sensSlider" min="1" max="10" step="1" value="6"></div>
    <div class="srow"><span>음악 볼륨</span><input type="range" id="bgmSlider" min="0" max="1" step=".05" value=".7"></div>
    <div class="srow"><span>효과음 볼륨</span><input type="range" id="sfxSlider" min="0" max="1" step=".05" value=".8"></div>
    <div class="srow"><span>난이도</span>
      <span>
        <button class="diff-btn active" data-d="easy">쉬움</button>
        <button class="diff-btn" data-d="normal">보통</button>
        <button class="diff-btn" data-d="hard">어려움</button>
      </span>
    </div>
    <div class="srow"><span>재보정</span><button class="diff-btn" id="recalibBtn">자이로 재보정</button></div>
    <button id="settingsClose">닫기</button>
  </div>
</div>
<script>
// ── Audio ─────────────────────────────────────────────────────────────────
let actx=null;
function getActx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
const BG_MELODY=[784,0,1047,784,880,0,1047,880,988,0,880,784,659,0,784,659,698,0,880,698,784,0,1047,784,880,659,784,0,523,659,784,0];
const BG_BASS  =[131,0,131,0,196,0,196,0,165,0,165,0,196,0,196,0,175,0,175,0,131,0,131,0,196,0,165,0,131,0,131,0];
const BG_DRUM  =['K','-','H','-','S','-','H','-','K','-','H','-','S','-','H','-','K','-','H','-','S','-','H','-','K','H','K','H','S','-','H','-'];
let bgmGain=null,bgmIdx=0,bgmTimer=null;
const sv=()=>settings.sfxVol;

function sfxKick(v){
  const a=getActx(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);
  o.frequency.setValueAtTime(150,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(40,a.currentTime+.1);
  g.gain.setValueAtTime(.7*v,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);
  o.start();o.stop(a.currentTime+.15);
}
function sfxSnare(v){
  const a=getActx(),buf=a.createBuffer(1,a.sampleRate*.1,a.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=buf;f.type='bandpass';f.frequency.value=2000;
  s.connect(f);f.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(.5*v,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.1);
  s.start();
}
function sfxHihat(v){
  const a=getActx(),buf=a.createBuffer(1,a.sampleRate*.04,a.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  s.buffer=buf;f.type='highpass';f.frequency.value=7000;
  s.connect(f);f.connect(g);g.connect(a.destination);
  g.gain.setValueAtTime(.25*v,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.04);
  s.start();
}
function sfxBeep(freq,dur,vol){
  dur=dur||.1;vol=vol||.3;
  const a=getActx(),o=a.createOscillator(),g=a.createGain();
  o.connect(g);g.connect(a.destination);o.frequency.value=freq;
  g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
  o.start();o.stop(a.currentTime+dur);
}

function bgmTick(){
  if(!bgmGain)return;
  const a=getActx(),v=settings.bgmVol;
  const m=BG_MELODY[bgmIdx],b=BG_BASS[bgmIdx],dr=BG_DRUM[bgmIdx];
  if(m){const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.connect(g);g.connect(a.destination);o.frequency.value=m;g.gain.setValueAtTime(.08*v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.start();o.stop(a.currentTime+.14);}
  if(b){const o=a.createOscillator(),g=a.createGain();o.type='sine';o.connect(g);g.connect(a.destination);o.frequency.value=b;g.gain.setValueAtTime(.06*v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.13);o.start();o.stop(a.currentTime+.14);}
  if(dr==='K')sfxKick(.4*v);
  else if(dr==='S')sfxSnare(.3*v);
  else if(dr==='H')sfxHihat(.2*v);
  bgmIdx=(bgmIdx+1)%BG_MELODY.length;
}
function startBgm(){
  getActx();
  if(bgmGain)return;
  bgmGain=getActx().createGain();bgmGain.connect(getActx().destination);
  bgmTimer=setInterval(bgmTick,150);
}
function stopBgm(){clearInterval(bgmTimer);bgmTimer=null;bgmGain=null;}

// ── Settings ──────────────────────────────────────────────────────────────
let settings={gyroSens:6,bgmVol:.70,sfxVol:.80,difficulty:'easy'};
function gyroMaxFromSens(s){return 62-(s-1)*5;}
try{const sv2=localStorage.getItem('sp_settings');if(sv2)settings=Object.assign(settings,JSON.parse(sv2));}catch(e){}
function saveSettings(){try{localStorage.setItem('sp_settings',JSON.stringify(settings));}catch(e){}}

// ── Gyro ──────────────────────────────────────────────────────────────────
let gyroEnabled=false,gyroGamma=0,gyroBaseline=0;
const GYRO_DEAD=10;
function setupGyro(){
  window.addEventListener('deviceorientation',function(e){if(e.gamma!==null)gyroGamma=e.gamma;});
  gyroEnabled=true;
}
function calibrateGyro(){gyroBaseline=gyroGamma;}
async function requestGyroAndStart(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{var r=await DeviceOrientationEvent.requestPermission();if(r==='granted'){setupGyro();setTimeout(calibrateGyro,150);}}
    catch(e){}
  }else{setupGyro();setTimeout(calibrateGyro,150);}
}

// ── Canvas ────────────────────────────────────────────────────────────────
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var W=360,H=640;

// ── 3D Constants ──────────────────────────────────────────────────────────
var HORIZON_Y=185;
var PENG_SCREEN_Y=520;
var ROAD_HW=115;
var MAX_DEPTH=500;
var NUM_STRIPS=36;

// ── Game state ────────────────────────────────────────────────────────────
var gameState='menu';
var score=0,fishCount=0,lives=3,distM=0;
var bestDist=0;
try{bestDist=parseInt(localStorage.getItem('sp_best')||'0');}catch(e){}
var speed=3.5,worldZ=0;
var pengX=0;
var pengVY=0,pengY=0,pengJumping=false,jumpCount=0;
var invincible=0,inkTimer=0,magnetTimer=0,dblJumpReady=false;
var roadCenterX=W/2,curveTargetX=W/2,curveTimer=0;
var objects=[],particles=[],gapZones=[];
var nextSpawnZ=200;

// ── Difficulty ────────────────────────────────────────────────────────────
function diffCfg(){
  if(settings.difficulty==='hard')return{spawnGap:100,obstRatio:.55};
  if(settings.difficulty==='normal')return{spawnGap:140,obstRatio:.40};
  return{spawnGap:180,obstRatio:.25};
}

// ── Projection ────────────────────────────────────────────────────────────
function project(wz,rx,wy){
  wy=wy||0;
  var t=Math.min(wz/MAX_DEPTH,1);
  var sy=PENG_SCREEN_Y-t*(PENG_SCREEN_Y-HORIZON_Y);
  var sx=W/2+(1-t)*((roadCenterX-W/2)+rx*ROAD_HW);
  var sc=1-t*.85;
  return{sx:sx,sy:sy-wy*(sc*1.5),scale:sc,t:t};
}

function lerp(a,b,t){return a+(b-a)*t;}

// ── Spawner ───────────────────────────────────────────────────────────────
function spawnSegment(){
  var cfg=diffCfg();
  var isObs=Math.random()<cfg.obstRatio;
  if(!isObs){
    var fishTypes=['orange','orange','orange','blue','blue','green','diamond'];
    var n=2+Math.floor(Math.random()*4);
    var spread=[-0.6,-0.3,0,0.3,0.6];
    spread.sort(function(){return Math.random()-.5;});
    for(var i=0;i<n;i++){
      var ft=fishTypes[Math.floor(Math.random()*fishTypes.length)];
      objects.push({type:'fish',ft:ft,wz:nextSpawnZ+Math.random()*30,rx:spread[i],wy:5,collected:false,hit:false});
    }
    if(Math.random()<.12){
      var bts=['magnet','invincibility','doublejump','chest'];
      objects.push({type:'booster',bt:bts[Math.floor(Math.random()*bts.length)],wz:nextSpawnZ+60,rx:(Math.random()-.5)*.8,wy:5,collected:false});
    }
  } else {
    var ot=Math.random();
    if(ot<.35){
      var nc=1+Math.floor(Math.random()*2);
      for(var j=0;j<nc;j++){
        var rx=(Math.random()-.5)*1.4;
        objects.push({type:'shadow',wz:nextSpawnZ-60,rx:rx,collected:false,hit:false});
        objects.push({type:'icicle',wz:nextSpawnZ,rx:rx,wy:0,collected:false,hit:false});
      }
    } else if(ot<.60){
      var gzMin=worldZ+nextSpawnZ-20;
      var gzMax=gzMin+80+Math.random()*60;
      gapZones.push({zMin:gzMin,zMax:gzMax,killing:false});
    } else if(ot<.80){
      objects.push({type:'octopus',wz:nextSpawnZ,rx:(Math.random()-.5)*.9,wy:0,collected:false,hit:false});
    } else {
      var dx=Math.random()<.5?-.45:.45;
      objects.push({type:'door',wz:nextSpawnZ,rx:dx,wy:0,collected:false,hit:false});
    }
  }
  nextSpawnZ+=cfg.spawnGap+Math.random()*80;
}

// ── Drawing ───────────────────────────────────────────────────────────────
function drawSky(){
  var grad=ctx.createLinearGradient(0,0,0,HORIZON_Y);
  grad.addColorStop(0,'#0a1a3a');grad.addColorStop(1,'#1a4a8a');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,HORIZON_Y);
  ctx.fillStyle='rgba(255,255,255,.6)';
  for(var i=0;i<30;i++){ctx.fillRect((i*73+13)%W,(i*47+7)%(HORIZON_Y-10),1,1);}
  ctx.fillStyle='rgba(255,240,180,.8)';
  ctx.beginPath();ctx.arc(300,40,22,0,Math.PI*2);ctx.fill();
}

function drawRoad(){
  for(var i=0;i<NUM_STRIPS;i++){
    var t0=i/NUM_STRIPS,t1=(i+1)/NUM_STRIPS;
    var y0=lerp(HORIZON_Y,PENG_SCREEN_Y+30,t0);
    var y1=lerp(HORIZON_Y,PENG_SCREEN_Y+30,t1);
    var wz0=(1-t0)*MAX_DEPTH;
    var hw0=ROAD_HW*t0+2,hw1=ROAD_HW*t1+2;
    var cx0=W/2+(roadCenterX-W/2)*(1-t0);
    var cx1=W/2+(roadCenterX-W/2)*(1-t1);
    var wzAbs=worldZ+wz0;
    var isGap=false;
    for(var g=0;g<gapZones.length;g++){if(wzAbs>=gapZones[g].zMin&&wzAbs<=gapZones[g].zMax){isGap=true;break;}}
    // sea left
    ctx.fillStyle='#03192e';
    ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(cx0-hw0,y0);ctx.lineTo(cx1-hw1,y1);ctx.lineTo(0,y1);ctx.closePath();ctx.fill();
    // sea right
    ctx.beginPath();ctx.moveTo(W,y0);ctx.lineTo(cx0+hw0,y0);ctx.lineTo(cx1+hw1,y1);ctx.lineTo(W,y1);ctx.closePath();ctx.fill();
    // road
    var bright=(i+Math.floor(worldZ/20))%2===0;
    ctx.fillStyle=isGap?'#050e1e':(bright?'#cceeff':'#b0d8ee');
    ctx.beginPath();ctx.moveTo(cx0-hw0,y0);ctx.lineTo(cx0+hw0,y0);ctx.lineTo(cx1+hw1,y1);ctx.lineTo(cx1-hw1,y1);ctx.closePath();ctx.fill();
    if(!isGap){
      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(cx0-hw0,y0);ctx.lineTo(cx1-hw1,y1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx0+hw0,y0);ctx.lineTo(cx1+hw1,y1);ctx.stroke();
      if(i%3===0){ctx.strokeStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.moveTo(cx0,y0);ctx.lineTo(cx1,y1);ctx.stroke();}
    }
  }
}

function drawObj(obj){
  var p=project(obj.wz,obj.rx,obj.wy||0);
  if(p.sy<HORIZON_Y||p.sy>PENG_SCREEN_Y+20)return;
  var sx=p.sx,sy=p.sy,sc=p.scale;
  ctx.save();
  if(obj.type==='shadow'){
    ctx.globalAlpha=.45;ctx.fillStyle='rgba(0,0,100,.7)';
    ctx.beginPath();ctx.ellipse(sx,sy,22*sc,8*sc,0,0,Math.PI*2);ctx.fill();
  } else if(obj.type==='icicle'){
    var w=18*sc,h=32*sc;
    ctx.shadowColor='#88ddff';ctx.shadowBlur=8*sc;
    var gr=ctx.createLinearGradient(sx,sy-h,sx,sy);
    gr.addColorStop(0,'#ddeeff');gr.addColorStop(.5,'#aaccee');gr.addColorStop(1,'rgba(180,220,240,.3)');
    ctx.fillStyle=gr;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-w/2,sy-h*.6);ctx.lineTo(sx,sy-h);ctx.lineTo(sx+w/2,sy-h*.6);ctx.closePath();ctx.fill();
  } else if(obj.type==='octopus'){
    var r=16*sc;
    ctx.fillStyle='#6622aa';ctx.beginPath();ctx.arc(sx,sy-r,r,0,Math.PI*2);ctx.fill();
    for(var k=0;k<6;k++){
      var a2=Math.PI+(k/5)*Math.PI,lx=sx+Math.cos(a2)*r*1.2,ly=sy+Math.sin(a2)*r*.8;
      ctx.strokeStyle='#8833cc';ctx.lineWidth=3*sc;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(lx,ly+r*.5,lx,ly);ctx.stroke();
    }
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx-5*sc,sy-r-3*sc,4*sc,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+5*sc,sy-r-3*sc,4*sc,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx-5*sc,sy-r-3*sc,2*sc,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(sx+5*sc,sy-r-3*sc,2*sc,0,Math.PI*2);ctx.fill();
  } else if(obj.type==='door'){
    var hw2=28*sc,hh=50*sc;
    ctx.fillStyle='#884400';ctx.fillRect(sx-hw2,sy-hh,hw2*2,hh);
    ctx.fillStyle='rgba(0,0,0,.6)';
    ctx.fillRect(sx-hw2+4*sc,sy-hh+4*sc,hw2-4*sc,hh-4*sc);
    ctx.fillRect(sx+4*sc,sy-hh+4*sc,hw2-8*sc,hh-4*sc);
  } else if(obj.type==='fish'&&!obj.collected){
    var fc=fishColor(obj.ft),r2=9*sc;
    if(obj.ft==='diamond'){
      var dd=12*sc;ctx.shadowColor='#88ffff';ctx.shadowBlur=10*sc;ctx.fillStyle=fc.body;
      ctx.beginPath();ctx.moveTo(sx,sy-dd);ctx.lineTo(sx+dd*.6,sy);ctx.lineTo(sx,sy+dd*.6);ctx.lineTo(sx-dd*.6,sy);ctx.closePath();ctx.fill();
    } else {
      ctx.fillStyle=fc.body;ctx.beginPath();ctx.ellipse(sx,sy,r2*1.4,r2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=fc.belly;ctx.beginPath();ctx.ellipse(sx,sy+r2*.2,r2*.9,r2*.5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=fc.body;ctx.beginPath();ctx.moveTo(sx-r2*1.4,sy);ctx.lineTo(sx-r2*2,sy-r2*.8);ctx.lineTo(sx-r2*2,sy+r2*.8);ctx.closePath();ctx.fill();
      ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx+r2*.8,sy-r2*.2,r2*.3,0,Math.PI*2);ctx.fill();
    }
  } else if(obj.type==='booster'&&!obj.collected){
    var br=11*sc,bcol='#ff88ff',blabel='?';
    if(obj.bt==='magnet'){bcol='#ff4444';blabel='🧲';}
    else if(obj.bt==='invincibility'){bcol='#ffff44';blabel='⭐';}
    else if(obj.bt==='doublejump'){bcol='#44ffff';blabel='🔼';}
    else{bcol='#ffcc00';blabel='💎';}
    ctx.shadowColor=bcol;ctx.shadowBlur=14*sc;ctx.fillStyle=bcol;
    ctx.beginPath();ctx.arc(sx,sy,br,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle='#000';
    ctx.font=Math.round(14*sc)+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(blabel,sx,sy);
  }
  ctx.restore();
}

function fishColor(ft){
  if(ft==='orange')return{body:'#ff8800',belly:'#ffcc66',pts:1};
  if(ft==='blue')return{body:'#2266ff',belly:'#88aaff',pts:3};
  if(ft==='green')return{body:'#22bb44',belly:'#88ee88',pts:5};
  return{body:'#aaddff',belly:'#ffffff',pts:10};
}

function drawPenguin(){
  var cx=W/2,cy=PENG_SCREEN_Y;
  var px=cx+pengX*ROAD_HW;
  var py=cy-pengY;
  ctx.save();
  if(invincible>0){ctx.globalAlpha=.5+.5*Math.sin(Date.now()*.03);ctx.shadowColor='#ffff80';ctx.shadowBlur=18;}
  ctx.fillStyle='rgba(0,0,80,.3)';ctx.beginPath();ctx.ellipse(px,cy,18,7,0,0,Math.PI*2);ctx.fill();
  if(invincible>0)ctx.globalAlpha=.5+.5*Math.sin(Date.now()*.03);else ctx.globalAlpha=1;
  var bh=42;
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.ellipse(px,py-bh*.38,14,bh*.5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fffde8';ctx.beginPath();ctx.ellipse(px,py-bh*.3,8,bh*.32,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(px,py-bh*.8,13,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-5,py-bh*.85,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(px+5,py-bh*.85,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(px-4,py-bh*.85,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(px+6,py-bh*.85,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff9900';ctx.beginPath();ctx.moveTo(px,py-bh*.78);ctx.lineTo(px+7,py-bh*.83);ctx.lineTo(px+7,py-bh*.76);ctx.closePath();ctx.fill();
  var fa=Math.sin(Date.now()*.01)*.3;
  ctx.fillStyle='#1a1a2e';
  ctx.save();ctx.translate(px-14,py-bh*.5);ctx.rotate(-0.5+fa);ctx.beginPath();ctx.ellipse(0,0,7,16,.3,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.save();ctx.translate(px+14,py-bh*.5);ctx.rotate(0.5-fa);ctx.beginPath();ctx.ellipse(0,0,7,16,-.3,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.fillStyle='#ff9900';
  ctx.beginPath();ctx.ellipse(px-7,py-1,6,4,-.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(px+7,py-1,6,4,.2,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawParticles(){
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];
    ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();ctx.restore();
    p.x+=p.vx;p.y+=p.vy;p.life-=.04;
    if(p.life<=0)particles.splice(i,1);
  }
}
function spawnFX(sx,sy,col,n){
  n=n||8;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,sp=1+Math.random()*3;
    particles.push({x:sx,y:sy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,r:4+Math.random()*4,col:col,life:1});
  }
}

// ── HUD ───────────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('livesBox').textContent='❤️'.repeat(lives);
  document.getElementById('distBox').textContent=Math.floor(distM)+'m';
  document.getElementById('bestBox').textContent='Best: '+Math.floor(bestDist)+'m';
  document.getElementById('fishBox').textContent='🐟 '+fishCount;
  var bt='';
  if(magnetTimer>0)bt+='🧲 ';if(invincible>0)bt+='⭐ ';if(dblJumpReady)bt+='🔼 ';
  document.getElementById('boostBox').textContent=bt;
}

// ── Collision ─────────────────────────────────────────────────────────────
function checkCollisions(){
  for(var i=0;i<objects.length;i++){
    var obj=objects[i];
    if(obj.hit||obj.collected)continue;
    if(obj.wz>18||obj.wz<-8)continue;
    var dx=Math.abs(pengX-obj.rx);
    if(obj.type==='fish'){
      if(dx<.18){obj.collected=true;var fc=fishColor(obj.ft);fishCount+=fc.pts;score+=fc.pts;sfxBeep(880,.08,sv()*.3);spawnFX(W/2+pengX*ROAD_HW,PENG_SCREEN_Y-pengY,fc.body);}
    } else if(obj.type==='booster'){
      if(dx<.20){obj.collected=true;activateBooster(obj.bt);sfxBeep(1047,.12,sv()*.3);spawnFX(W/2+pengX*ROAD_HW,PENG_SCREEN_Y-pengY,'#ffff80',12);}
    } else if(obj.type==='icicle'){
      if(dx<.16&&pengY<20){obj.hit=true;hitPlayer();}
    } else if(obj.type==='octopus'){
      if(dx<.22){obj.hit=true;inkTimer=180;document.getElementById('inkOverlay').style.background='rgba(20,0,40,.82)';setTimeout(function(){document.getElementById('inkOverlay').style.background='rgba(20,0,40,.0)';},3000);hitPlayer();}
    } else if(obj.type==='door'){
      if(dx<.22&&pengY<10){obj.hit=true;hitPlayer();}
    }
    if(magnetTimer>0&&obj.type==='fish'&&!obj.collected&&obj.wz<80){
      obj.rx+=(pengX-obj.rx)*.08;
    }
  }
}

function checkGap(){
  for(var g=0;g<gapZones.length;g++){
    var gz=gapZones[g];
    if(worldZ>=gz.zMin&&worldZ<=gz.zMax&&pengY<8){
      if(!gz.killing){gz.killing=true;hitPlayer();}
    } else {gz.killing=false;}
  }
}

function activateBooster(bt){
  if(bt==='magnet')magnetTimer=300;
  else if(bt==='invincibility')invincible=300;
  else if(bt==='doublejump')dblJumpReady=true;
  else{fishCount+=20;score+=20;sfxBeep(1320,.2,sv()*.4);}
}

function hitPlayer(){
  if(invincible>0)return;
  lives--;sfxBeep(220,.3,sv()*.5);invincible=120;
  if(lives<=0){lives=0;setTimeout(gameOver,300);}
}

// ── Game flow ─────────────────────────────────────────────────────────────
function startGame(){
  gameState='playing';score=0;fishCount=0;lives=3;distM=0;worldZ=0;
  pengX=0;pengY=0;pengVY=0;pengJumping=false;jumpCount=0;
  invincible=0;inkTimer=0;magnetTimer=0;dblJumpReady=false;
  roadCenterX=W/2;curveTargetX=W/2;curveTimer=0;
  objects=[];particles=[];gapZones=[];nextSpawnZ=150;
  speed=3.5+({easy:0,normal:.5,hard:1}[settings.difficulty]||0);
  document.getElementById('overlay').style.display='none';
  document.getElementById('gameoverPanel').style.display='none';
  document.getElementById('settingsBtn').style.display='block';
  document.getElementById('inkOverlay').style.background='rgba(20,0,40,.0)';
  startBgm();
}

function gameOver(){
  gameState='gameover';
  if(distM>bestDist){bestDist=distM;try{localStorage.setItem('sp_best',Math.floor(bestDist));}catch(e){}}
  stopBgm();
  document.getElementById('goDistTxt').textContent='거리: '+Math.floor(distM)+'m';
  document.getElementById('goFishTxt').textContent='물고기: '+fishCount+'점';
  document.getElementById('goBestTxt').textContent='최고기록: '+Math.floor(bestDist)+'m';
  document.getElementById('gameoverPanel').style.display='flex';
  sfxBeep(220,.5,sv()*.6);
}

// ── Update ────────────────────────────────────────────────────────────────
function update(){
  if(gameState!=='playing')return;
  speed=Math.min(speed+.0004,12+({easy:0,normal:1,hard:2}[settings.difficulty]||0));
  worldZ+=speed;distM=worldZ/20;
  curveTimer--;
  if(curveTimer<=0){curveTargetX=W/2+(Math.random()-.5)*180;curveTimer=120+Math.random()*180;}
  roadCenterX+=(curveTargetX-roadCenterX)*.012;
  // input
  var tx=pengX;
  if(gyroEnabled){
    var raw=gyroGamma-gyroBaseline,dead=GYRO_DEAD,maxA=gyroMaxFromSens(settings.gyroSens);
    if(Math.abs(raw)>dead){tx=(Math.abs(raw)-dead)/(maxA-dead)*(raw>0?1:-1);tx=Math.max(-1,Math.min(1,tx));}
    else tx*=.88;
  } else {
    if(keys['ArrowLeft']||keys['a'])tx=Math.max(tx-.04,-1);
    else if(keys['ArrowRight']||keys['d'])tx=Math.min(tx+.04,1);
    else tx*=.9;
  }
  pengX+=(tx-pengX)*.15;pengX=Math.max(-1,Math.min(1,pengX));
  // jump
  if(pengJumping||pengY>0){pengVY-=0.7;pengY+=pengVY;if(pengY<=0){pengY=0;pengVY=0;pengJumping=false;jumpCount=0;}}
  // timers
  if(invincible>0)invincible--;if(magnetTimer>0)magnetTimer--;if(inkTimer>0){inkTimer--;if(inkTimer===0)document.getElementById('inkOverlay').style.background='rgba(20,0,40,.0)';}
  // objects
  for(var i=0;i<objects.length;i++)objects[i].wz-=speed;
  for(var i=objects.length-1;i>=0;i--){if(objects[i].wz<-30)objects.splice(i,1);}
  for(var i=gapZones.length-1;i>=0;i--){if(worldZ>gapZones[i].zMax+200)gapZones.splice(i,1);}
  while(nextSpawnZ-worldZ<MAX_DEPTH*1.1)spawnSegment();
  checkCollisions();checkGap();updateHUD();
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,W,H);
  drawSky();drawRoad();
  var sorted=objects.slice().sort(function(a,b){return b.wz-a.wz;});
  for(var i=0;i<sorted.length;i++)drawObj(sorted[i]);
  drawPenguin();drawParticles();
}

function loop(){update();render();requestAnimationFrame(loop);}

// ── Input ─────────────────────────────────────────────────────────────────
var keys={};
window.addEventListener('keydown',function(e){keys[e.key]=true;if((e.key===' '||e.key==='ArrowUp')&&gameState==='playing')doJump();});
window.addEventListener('keyup',function(e){keys[e.key]=false;});
canvas.addEventListener('touchstart',function(e){e.preventDefault();if(gameState==='playing')doJump();},{passive:false});
canvas.addEventListener('mousedown',function(){if(gameState==='playing')doJump();});
function doJump(){
  if(pengY===0&&!pengJumping){pengVY=14;pengJumping=true;jumpCount=1;sfxBeep(523,.1,sv()*.35);}
  else if(jumpCount<2&&dblJumpReady){pengVY=12;jumpCount=2;dblJumpReady=false;sfxBeep(659,.1,sv()*.35);spawnFX(W/2+pengX*ROAD_HW,PENG_SCREEN_Y-pengY,'#44ffff',6);}
}

// ── Settings UI ───────────────────────────────────────────────────────────
document.getElementById('sensSlider').value=settings.gyroSens;
document.getElementById('bgmSlider').value=settings.bgmVol;
document.getElementById('sfxSlider').value=settings.sfxVol;
document.querySelectorAll('.diff-btn[data-d]').forEach(function(b){
  b.classList.toggle('active',b.dataset.d===settings.difficulty);
  b.addEventListener('click',function(){
    settings.difficulty=b.dataset.d;
    document.querySelectorAll('.diff-btn[data-d]').forEach(function(x){x.classList.toggle('active',x===b);});
    saveSettings();
  });
});
document.getElementById('sensSlider').addEventListener('input',function(e){settings.gyroSens=+e.target.value;saveSettings();});
document.getElementById('bgmSlider').addEventListener('input',function(e){settings.bgmVol=+e.target.value;saveSettings();});
document.getElementById('sfxSlider').addEventListener('input',function(e){settings.sfxVol=+e.target.value;saveSettings();});
document.getElementById('settingsBtn').addEventListener('click',function(){document.getElementById('settingsPanel').style.display='block';});
document.getElementById('settingsClose').addEventListener('click',function(){document.getElementById('settingsPanel').style.display='none';});
document.getElementById('recalibBtn').addEventListener('click',calibrateGyro);

document.getElementById('startBtn').addEventListener('click',function(){
  getActx().resume();
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){requestGyroAndStart().then(startGame);}
  else startGame();
});
document.getElementById('restartBtn').addEventListener('click',function(){document.getElementById('gameoverPanel').style.display='none';startGame();});
if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){
  document.getElementById('gyroBtn').style.display='inline-block';
  document.getElementById('gyroBtn').addEventListener('click',function(){requestGyroAndStart();});
}

requestAnimationFrame(loop);
</script>
