<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>슈퍼펭귄</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;touch-action:none}
#gameCanvas{display:block;position:fixed;top:0;left:0}
#ui{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:10}
#hud{display:none;justify-content:space-between;align-items:flex-start;padding:12px 14px 0}
#livesBox{font-size:20px}
#centerHud{text-align:center}
#distBox{font-size:22px;font-weight:bold;color:#fff;text-shadow:0 2px 4px #000}
#bestBox{font-size:12px;color:#ffe080;margin-top:2px}
#fishBox{font-size:18px;color:#ff9900;font-weight:bold}
#boostBox{text-align:center;font-size:13px;color:#80ffff;padding:4px 0 0;height:20px}
#overlay,#gameoverPanel{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:20}
#overlay{background:rgba(0,20,60,.92)}
#overlay h1{color:#fff;font-size:32px;text-shadow:0 2px 8px #08f;margin-bottom:6px}
#overlay p{color:#9cf;font-size:14px;margin-bottom:20px;text-align:center;line-height:1.6}
.btn{padding:13px 38px;font-size:17px;border:none;border-radius:28px;background:linear-gradient(135deg,#0af,#06c);color:#fff;cursor:pointer;margin:5px;font-family:inherit;box-shadow:0 4px 14px rgba(0,160,255,.4)}
.btn:active{transform:scale(.95)}
#gyroBtn{display:none}
#gameoverPanel{background:rgba(0,0,30,.9);display:none}
#gameoverPanel h2{color:#f44;font-size:30px;margin-bottom:14px}
.goRow{color:#eee;font-size:17px;margin:3px 0}
#settingsBtn{position:fixed;bottom:16px;right:14px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:22px;cursor:pointer;z-index:15;display:none;pointer-events:auto}
#settingsPanel{position:fixed;bottom:64px;right:14px;width:226px;background:rgba(8,18,55,.97);border:1px solid rgba(0,140,255,.35);border-radius:14px;padding:14px 16px;display:none;z-index:25}
#settingsPanel h3{color:#8cf;font-size:14px;margin-bottom:10px}
.srow{display:flex;justify-content:space-between;align-items:center;margin:8px 0;color:#cde;font-size:12px}
.srow input[type=range]{width:100px;accent-color:#0af}
.db{padding:4px 9px;border:1px solid #0af;border-radius:9px;background:transparent;color:#0af;font-size:11px;cursor:pointer;margin-left:2px}
.db.on{background:#0af;color:#000}
#settingsClose{display:block;margin:10px auto 0;padding:5px 18px;border:1px solid #0af;border-radius:9px;background:transparent;color:#0af;font-size:12px;cursor:pointer}
#inkScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,0,30,0);pointer-events:none;z-index:8;transition:background .4s}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="inkScreen"></div>
<div id="ui">
  <div id="hud">
    <div id="livesBox">❤️❤️❤️</div>
    <div id="centerHud">
      <div id="distBox">0m</div>
      <div id="bestBox">Best: 0m</div>
    </div>
    <div id="fishBox">🐟 0</div>
  </div>
  <div id="boostBox"></div>
</div>
<div id="overlay">
  <h1>🐧 슈퍼펭귄</h1>
  <p>폰 기울이기 = 좌우 이동<br>화면 터치 = 점프</p>
  <button class="btn" id="startBtn">시작!</button>
  <button class="btn" id="gyroBtn">자이로 허용 📱</button>
</div>
<div id="gameoverPanel">
  <h2>Game Over</h2>
  <div class="goRow" id="goDist"></div>
  <div class="goRow" id="goFish"></div>
  <div class="goRow" id="goBest"></div>
  <button class="btn" id="restartBtn" style="margin-top:14px">다시 시작</button>
</div>
<button id="settingsBtn">⚙️</button>
<div id="settingsPanel">
  <h3>⚙️ 설정</h3>
  <div class="srow"><span>자이로 민감도</span><input type="range" id="sensSlider" min="1" max="10" step="1" value="6"></div>
  <div class="srow"><span>음악 볼륨</span><input type="range" id="bgmSlider" min="0" max="1" step=".05" value=".7"></div>
  <div class="srow"><span>효과음 볼륨</span><input type="range" id="sfxSlider" min="0" max="1" step=".05" value=".8"></div>
  <div class="srow"><span>난이도</span>
    <span>
      <button class="db on" data-d="easy">쉬움</button>
      <button class="db" data-d="normal">보통</button>
      <button class="db" data-d="hard">어려움</button>
    </span>
  </div>
  <div class="srow"><span>자이로 재보정</span><button class="db" id="recalibBtn">재보정</button></div>
  <button id="settingsClose">닫기</button>
</div>

<script>
(function(){
'use strict';

// ── Canvas setup ──────────────────────────────────────────────────────────
var C=document.getElementById('gameCanvas');
var ctx=C.getContext('2d');
var W,H,SC; // logical 360x640, SC=scale factor

function resize(){
  var vw=window.innerWidth,vh=window.innerHeight;
  SC=Math.min(vw/360,vh/640);
  C.width=Math.round(360*SC);
  C.height=Math.round(640*SC);
  C.style.width=C.width+'px';
  C.style.height=C.height+'px';
  C.style.left=Math.round((vw-C.width)/2)+'px';
  C.style.top=Math.round((vh-C.height)/2)+'px';
  ctx.setTransform(SC,0,0,SC,0,0);
  W=360;H=640;
}
resize();
window.addEventListener('resize',resize);

// ── Settings ──────────────────────────────────────────────────────────────
var cfg={gyroSens:6,bgmVol:.70,sfxVol:.80,difficulty:'easy'};
try{var _s=localStorage.getItem('spg');if(_s)cfg=Object.assign(cfg,JSON.parse(_s));}catch(e){}
function saveCfg(){try{localStorage.setItem('spg',JSON.stringify(cfg));}catch(e){}}
function gyroMax(){return 62-(cfg.gyroSens-1)*5;}

// ── Audio ─────────────────────────────────────────────────────────────────
var actx=null;
function AC(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
var bgmTimer=null,bgmRunning=false,bgmIdx=0;
var MEL=[784,0,1047,784,880,0,1047,880,988,0,880,784,659,0,784,659,698,0,880,698,784,0,1047,784,880,659,784,0,523,659,784,0];
var BAS=[131,0,131,0,196,0,196,0,165,0,165,0,196,0,196,0,175,0,175,0,131,0,131,0,196,0,165,0,131,0,131,0];
var DRM=['K','-','H','-','S','-','H','-','K','-','H','-','S','-','H','-','K','-','H','-','S','-','H','-','K','H','K','H','S','-','H','-'];

function tone(freq,type,vol,dur){
  try{var a=AC(),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.connect(g);g.connect(a.destination);o.frequency.value=freq;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.start();o.stop(a.currentTime+dur+.01);}catch(e){}
}
function noise(ftype,freq,vol,dur){
  try{var a=AC(),n=a.sampleRate*dur,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;f.type=ftype;f.frequency.value=freq;s.connect(f);f.connect(g);g.connect(a.destination);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);s.start();}catch(e){}
}
function kick(){noise('lowpass',150,.5,.15);}
function snare(){noise('bandpass',2000,.35,.1);}
function hihat(){noise('highpass',7000,.15,.04);}
function beep(f,d,v){tone(f,'sine',v||.3,d||.1);}

function bgmTick(){
  var v=cfg.bgmVol;
  if(MEL[bgmIdx])tone(MEL[bgmIdx],'triangle',.08*v,.13);
  if(BAS[bgmIdx])tone(BAS[bgmIdx],'sine',.06*v,.13);
  var dr=DRM[bgmIdx];
  if(dr==='K')kick();else if(dr==='S')snare();else if(dr==='H')hihat();
  bgmIdx=(bgmIdx+1)%MEL.length;
}
function startBgm(){if(bgmRunning)return;bgmRunning=true;bgmIdx=0;bgmTimer=setInterval(bgmTick,150);}
function stopBgm(){clearInterval(bgmTimer);bgmRunning=false;}

// ── Gyro ──────────────────────────────────────────────────────────────────
var gyroOn=false,gyroVal=0,gyroBL=0;
function gyroEvt(e){if(e.gamma!=null)gyroVal=e.gamma;}
function setupGyro(){window.addEventListener('deviceorientation',gyroEvt);gyroOn=true;}
function calibGyro(){gyroBL=gyroVal;}
function gyroInput(){
  var raw=gyroVal-gyroBL,dead=10,mx=gyroMax();
  if(Math.abs(raw)<dead)return 0;
  return Math.max(-1,Math.min(1,(Math.abs(raw)-dead)/(mx-dead)*(raw>0?1:-1)));
}
async function reqGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{if(await DeviceOrientationEvent.requestPermission()==='granted'){setupGyro();setTimeout(calibGyro,200);}}catch(e){}
  }else{setupGyro();setTimeout(calibGyro,200);}
}

// ── Keyboard ──────────────────────────────────────────────────────────────
var keys={};
window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();doJump();}});
window.addEventListener('keyup',function(e){keys[e.key]=false;});

// ── 3D constants ──────────────────────────────────────────────────────────
var HY=190;   // horizon Y
var PY=510;   // player base Y (screen)
var RHW=120;  // road half-width at player level
var ZDEPTH=480; // max depth
var NSTRIP=34;

// ── Game state ─────────────────────────────────────────────────────────────
var gs='menu'; // menu|play|dead|over
var dist,fish,lives,score,worldZ;
var spd,spx,spy,spvy,spJump,spJC; // penguin
var invT,inkT,magT,dblJ;
var rcX,rcTarget,rcTimer;   // road curve
var objs,gaps,parts;
var nxtSpawn;
var bestDist=0;
try{bestDist=parseInt(localStorage.getItem('spgb')||'0');}catch(e){}

function initGame(){
  dist=0;fish=0;lives=3;score=0;worldZ=0;
  spd=3.5+({easy:0,normal:.5,hard:1}[cfg.difficulty]||0);
  spx=0;spy=0;spvy=0;spJump=false;spJC=0;
  invT=0;inkT=0;magT=0;dblJ=false;
  rcX=W/2;rcTarget=W/2;rcTimer=0;
  objs=[];gaps=[];parts=[];
  nxtSpawn=140;
}

// ── Projection ────────────────────────────────────────────────────────────
function proj(wz,rx,wy){
  wy=wy||0;
  var t=Math.max(0,Math.min(1,wz/ZDEPTH));
  var sy=PY-t*(PY-HY);
  var sx=W/2+(1-t)*((rcX-W/2)+rx*RHW);
  var sc=1-t*.82;
  return{x:sx,y:sy-wy*(sc*1.4),s:sc,t:t};
}

function lerp(a,b,t){return a+(b-a)*t;}

// ── Spawner ───────────────────────────────────────────────────────────────
function spawnSeg(){
  var oR={easy:.22,normal:.38,hard:.52}[cfg.difficulty]||.22;
  var isObs=Math.random()<oR;
  var gap={easy:190,normal:150,hard:110}[cfg.difficulty]||190;
  if(!isObs){
    var fts=['o','o','o','b','b','g','d'];
    var n=2+Math.floor(Math.random()*4);
    var rxs=[-0.65,-0.35,0,0.35,0.65].sort(function(){return Math.random()-.5;}).slice(0,n);
    for(var i=0;i<n;i++){
      objs.push({k:'fish',ft:rxs[i]<-0.5?'o':fts[Math.floor(Math.random()*fts.length)],wz:nxtSpawn+Math.random()*25,rx:rxs[i],wy:6,got:false});
    }
    if(Math.random()<.1){
      var bts=['mag','inv','dbl','chest'];
      objs.push({k:'boost',bt:bts[Math.floor(Math.random()*bts.length)],wz:nxtSpawn+55,rx:(Math.random()-.5)*.75,wy:6,got:false});
    }
  } else {
    var ot=Math.random();
    if(ot<.32){
      var nc=1+Math.floor(Math.random()*2);
      for(var j=0;j<nc;j++){
        var rx=(Math.random()-.5)*1.35;
        objs.push({k:'shadow',wz:nxtSpawn-55,rx:rx});
        objs.push({k:'ice',wz:nxtSpawn,rx:rx,wy:0,hit:false});
      }
    }else if(ot<.56){
      var gMin=worldZ+nxtSpawn-15,gMax=gMin+75+Math.random()*55;
      gaps.push({a:gMin,b:gMax,kill:false});
    }else if(ot<.78){
      objs.push({k:'octo',wz:nxtSpawn,rx:(Math.random()-.5)*.85,wy:0,hit:false});
    }else{
      objs.push({k:'door',wz:nxtSpawn,rx:(Math.random()<.5?-.4:.4),wy:0,hit:false});
    }
  }
  nxtSpawn+=gap+Math.random()*75;
}

// ── Fish helpers ──────────────────────────────────────────────────────────
function fcol(ft){
  if(ft==='o')return{b:'#ff7700',f:'#ffcc55',p:1};
  if(ft==='b')return{b:'#1155ee',f:'#7799ff',p:3};
  if(ft==='g')return{b:'#11aa33',f:'#66dd77',p:5};
  return{b:'#88ccff',f:'#ffffff',p:10};
}

// ── Drawing ───────────────────────────────────────────────────────────────
function arc(cx,cy,r){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);}

function drawSky(){
  var g=ctx.createLinearGradient(0,0,0,HY);
  g.addColorStop(0,'#081830');g.addColorStop(1,'#1555a0');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HY);
  // stars
  ctx.fillStyle='rgba(255,255,255,.5)';
  for(var i=0;i<25;i++)ctx.fillRect((i*79+17)%W,(i*43+11)%(HY-15),1.5,1.5);
  // moon
  ctx.fillStyle='rgba(255,245,190,.85)';
  arc(295,38,18);ctx.fill();
  ctx.fillStyle='rgba(0,30,80,.7)';
  arc(303,34,15);ctx.fill();
}

function drawRoad(){
  for(var i=0;i<NSTRIP;i++){
    var t0=i/NSTRIP,t1=(i+1)/NSTRIP;
    var y0=lerp(HY,PY+30,t0),y1=lerp(HY,PY+30,t1);
    var hw0=RHW*t0+2,hw1=RHW*t1+2;
    var cx0=W/2+(rcX-W/2)*(1-t0);
    var cx1=W/2+(rcX-W/2)*(1-t1);
    // gap check
    var wzA=worldZ+(1-t0)*ZDEPTH;
    var isGap=false;
    for(var g=0;g<gaps.length;g++){
      if(wzA>=gaps[g].a&&wzA<=gaps[g].b){isGap=true;break;}
    }
    // sea left
    ctx.fillStyle='#02111f';
    ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(cx0-hw0,y0);ctx.lineTo(cx1-hw1,y1);ctx.lineTo(0,y1);ctx.closePath();ctx.fill();
    // sea right
    ctx.beginPath();ctx.moveTo(W,y0);ctx.lineTo(cx0+hw0,y0);ctx.lineTo(cx1+hw1,y1);ctx.lineTo(W,y1);ctx.closePath();ctx.fill();
    // road strip
    if(isGap){
      ctx.fillStyle='#020a14';
    }else{
      ctx.fillStyle=((i+Math.floor(worldZ/22))%2)?'#bbd8ee':'#cce8ff';
    }
    ctx.beginPath();ctx.moveTo(cx0-hw0,y0);ctx.lineTo(cx0+hw0,y0);ctx.lineTo(cx1+hw1,y1);ctx.lineTo(cx1-hw1,y1);ctx.closePath();ctx.fill();
    if(!isGap){
      ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(cx0-hw0,y0);ctx.lineTo(cx1-hw1,y1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx0+hw0,y0);ctx.lineTo(cx1+hw1,y1);ctx.stroke();
      if(i%4===0){ctx.strokeStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.moveTo(cx0,y0);ctx.lineTo(cx1,y1);ctx.stroke();}
    }
  }
}

function drawObjects(){
  var sorted=objs.slice().sort(function(a,b){return b.wz-a.wz;});
  for(var i=0;i<sorted.length;i++){
    var o=sorted[i];
    var p=proj(o.wz,o.rx||0,o.wy||0);
    if(p.y<HY-5||p.y>PY+25)continue;
    var sx=p.x,sy=p.y,sc=p.s;
    ctx.save();
    if(o.k==='shadow'){
      ctx.globalAlpha=.5;ctx.fillStyle='rgba(0,0,80,.65)';
      ctx.beginPath();ctx.moveTo(sx-20*sc,sy);ctx.lineTo(sx+20*sc,sy);ctx.lineTo(sx+14*sc,sy-6*sc);ctx.lineTo(sx-14*sc,sy-6*sc);ctx.closePath();ctx.fill();
    }else if(o.k==='ice'){
      var iw=14*sc,ih=28*sc;
      ctx.shadowColor='#aaeeff';ctx.shadowBlur=10;
      var ig=ctx.createLinearGradient(sx,sy-ih,sx,sy);
      ig.addColorStop(0,'#eef8ff');ig.addColorStop(.6,'#99ccee');ig.addColorStop(1,'rgba(160,210,235,.2)');
      ctx.fillStyle=ig;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-iw*.6,sy-ih*.55);ctx.lineTo(sx,sy-ih);ctx.lineTo(sx+iw*.6,sy-ih*.55);ctx.closePath();ctx.fill();
    }else if(o.k==='octo'&&!o.hit){
      var or=15*sc;
      ctx.fillStyle='#551199';arc(sx,sy-or,or);ctx.fill();
      for(var t=0;t<6;t++){
        var ang=Math.PI+(t/5)*Math.PI;
        ctx.strokeStyle='#7722bb';ctx.lineWidth=2.5*sc;
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(sx+Math.cos(ang)*or*1.1,sy+Math.sin(ang)*or*.7+or*.4,sx+Math.cos(ang)*or*1.1,sy+Math.sin(ang)*or*.7);ctx.stroke();
      }
      ctx.fillStyle='#fff';arc(sx-5*sc,sy-or-2*sc,3.5*sc);ctx.fill();arc(sx+5*sc,sy-or-2*sc,3.5*sc);ctx.fill();
      ctx.fillStyle='#000';arc(sx-4*sc,sy-or-2*sc,1.8*sc);ctx.fill();arc(sx+6*sc,sy-or-2*sc,1.8*sc);ctx.fill();
    }else if(o.k==='door'&&!o.hit){
      var dw=26*sc,dh=48*sc;
      ctx.fillStyle='#774400';ctx.fillRect(sx-dw,sy-dh,dw*2,dh);
      ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(sx-dw+3*sc,sy-dh+3*sc,dw-3*sc,dh-3*sc);
      ctx.fillRect(sx+3*sc,sy-dh+3*sc,dw-6*sc,dh-3*sc);
    }else if(o.k==='fish'&&!o.got){
      var fc=fcol(o.ft),fr=8*sc;
      if(o.ft==='d'){
        var ds=11*sc;ctx.shadowColor='#66eeff';ctx.shadowBlur=10;ctx.fillStyle=fc.b;
        ctx.beginPath();ctx.moveTo(sx,sy-ds);ctx.lineTo(sx+ds*.55,sy);ctx.lineTo(sx,sy+ds*.55);ctx.lineTo(sx-ds*.55,sy);ctx.closePath();ctx.fill();
      }else{
        ctx.fillStyle=fc.b;ctx.beginPath();ctx.moveTo(sx+fr*1.4,sy);ctx.quadraticCurveTo(sx,sy-fr,sx-fr*1.4,sy);ctx.quadraticCurveTo(sx,sy+fr,sx+fr*1.4,sy);ctx.fill();
        ctx.fillStyle=fc.f;ctx.beginPath();ctx.moveTo(sx+fr*.8,sy);ctx.quadraticCurveTo(sx,sy-fr*.45,sx-fr*.5,sy);ctx.quadraticCurveTo(sx,sy+fr*.45,sx+fr*.8,sy);ctx.fill();
        ctx.fillStyle='#550';arc(sx-fr*.1,sy-fr*.1,fr*.28*sc/sc);ctx.fill();
        // tail
        ctx.fillStyle=fc.b;ctx.beginPath();ctx.moveTo(sx-fr*1.4,sy);ctx.lineTo(sx-fr*2.1,sy-fr*.65);ctx.lineTo(sx-fr*2.1,sy+fr*.65);ctx.closePath();ctx.fill();
      }
    }else if(o.k==='boost'&&!o.got){
      var br=10*sc;
      var bc={'mag':'#ee3333','inv':'#eeee00','dbl':'#33dddd','chest':'#ffbb00'}[o.bt]||'#ff88ff';
      var bl={'mag':'🧲','inv':'⭐','dbl':'🔼','chest':'💎'}[o.bt]||'?';
      ctx.shadowColor=bc;ctx.shadowBlur=16;ctx.fillStyle=bc;arc(sx,sy,br);ctx.fill();
      ctx.shadowBlur=0;
      ctx.font=Math.round(Math.max(8,12*sc))+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';
      ctx.fillText(bl,sx,sy);
    }
    ctx.restore();
  }
}

function drawPenguin(){
  var px=W/2+spx*RHW;
  var py=PY-spy;
  ctx.save();
  if(invT>0){ctx.globalAlpha=.5+.45*Math.sin(Date.now()*.025);ctx.shadowColor='#ffff88';ctx.shadowBlur=22;}
  var bh=40;
  // shadow
  ctx.globalAlpha=(ctx.globalAlpha||1)*.65;
  ctx.fillStyle='rgba(0,0,60,.4)';
  ctx.beginPath();ctx.moveTo(px-17,PY);ctx.lineTo(px+17,PY);ctx.lineTo(px+12,PY-6);ctx.lineTo(px-12,PY-6);ctx.closePath();ctx.fill();
  ctx.globalAlpha=invT>0?(.5+.45*Math.sin(Date.now()*.025)):1;
  // body
  ctx.fillStyle='#111122';
  ctx.beginPath();ctx.moveTo(px-12,py);ctx.quadraticCurveTo(px-15,py-bh*.5,px,py-bh);ctx.quadraticCurveTo(px+15,py-bh*.5,px+12,py);ctx.closePath();ctx.fill();
  // belly
  ctx.fillStyle='#fffce8';
  ctx.beginPath();ctx.moveTo(px-7,py-3);ctx.quadraticCurveTo(px-8,py-bh*.4,px,py-bh*.65);ctx.quadraticCurveTo(px+8,py-bh*.4,px+7,py-3);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle='#111122';arc(px,py-bh-4,12);ctx.fill();
  // eyes
  ctx.fillStyle='#fff';arc(px-4.5,py-bh-7,3.5);ctx.fill();arc(px+4.5,py-bh-7,3.5);ctx.fill();
  ctx.fillStyle='#1a1a44';arc(px-3.5,py-bh-7,2);ctx.fill();arc(px+5.5,py-bh-7,2);ctx.fill();
  ctx.fillStyle='#fff';arc(px-3,py-bh-8,1);ctx.fill();arc(px+6,py-bh-8,1);ctx.fill();
  // beak
  ctx.fillStyle='#ff8800';ctx.beginPath();ctx.moveTo(px,py-bh-4);ctx.lineTo(px+9,py-bh-7);ctx.lineTo(px+9,py-bh-2);ctx.closePath();ctx.fill();
  // flippers
  var fa=Math.sin(Date.now()*.009)*.32;
  ctx.fillStyle='#111122';
  ctx.save();ctx.translate(px-13,py-bh*.5);ctx.rotate(-0.45+fa);ctx.beginPath();ctx.moveTo(0,-15);ctx.quadraticCurveTo(-7,0,0,15);ctx.quadraticCurveTo(3,5,6,-15);ctx.closePath();ctx.fill();ctx.restore();
  ctx.save();ctx.translate(px+13,py-bh*.5);ctx.rotate(0.45-fa);ctx.beginPath();ctx.moveTo(0,-15);ctx.quadraticCurveTo(7,0,0,15);ctx.quadraticCurveTo(-3,5,-6,-15);ctx.closePath();ctx.fill();ctx.restore();
  // feet
  ctx.fillStyle='#ff7700';
  ctx.beginPath();ctx.moveTo(px-4,py);ctx.lineTo(px-10,py+6);ctx.lineTo(px,py+6);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(px+4,py);ctx.lineTo(px+10,py+6);ctx.lineTo(px,py+6);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawParticles(){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    ctx.save();ctx.globalAlpha=p.l;ctx.fillStyle=p.c;
    arc(p.x,p.y,p.r*p.l);ctx.fill();ctx.restore();
    p.x+=p.vx;p.y+=p.vy;p.l-=.035;
    if(p.l<=0)parts.splice(i,1);
  }
}

function burst(x,y,col,n){
  n=n||8;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,v=1.5+Math.random()*3;
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,r:3+Math.random()*4,c:col,l:1});
  }
}

// ── HUD update ────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('livesBox').textContent='❤️'.repeat(Math.max(0,lives));
  document.getElementById('distBox').textContent=Math.floor(dist)+'m';
  document.getElementById('bestBox').textContent='Best: '+Math.floor(bestDist)+'m';
  document.getElementById('fishBox').textContent='🐟 '+fish;
  var bt='';if(magT>0)bt+='🧲 ';if(invT>0)bt+='⭐ ';if(dblJ)bt+='🔼 ';
  document.getElementById('boostBox').textContent=bt;
}

// ── Collisions ────────────────────────────────────────────────────────────
function collide(){
  for(var i=0;i<objs.length;i++){
    var o=objs[i];
    if(o.got||o.hit)continue;
    if(o.wz>20||o.wz<-10)continue;
    var dx=Math.abs(spx-o.rx);
    if(o.k==='fish'){
      if(dx<.19){o.got=true;var fc=fcol(o.ft);fish+=fc.p;score+=fc.p;beep(880,.07,cfg.sfxVol*.3);burst(W/2+spx*RHW,PY-spy,fc.b);}
    }else if(o.k==='boost'){
      if(dx<.21){o.got=true;applyBoost(o.bt);beep(1047,.12,cfg.sfxVol*.28);burst(W/2+spx*RHW,PY-spy,'#ffee88',12);}
    }else if(o.k==='ice'){
      if(dx<.15&&spy<18){o.hit=true;hit();}
    }else if(o.k==='octo'){
      if(dx<.22){o.hit=true;inkT=200;document.getElementById('inkScreen').style.background='rgba(15,0,30,.85)';setTimeout(function(){document.getElementById('inkScreen').style.background='rgba(15,0,30,0)';},3200);hit();}
    }else if(o.k==='door'){
      if(dx<.21&&spy<12){o.hit=true;hit();}
    }
    if(magT>0&&o.k==='fish'&&!o.got&&o.wz<85)o.rx+=(spx-o.rx)*.09;
  }
  for(var g=0;g<gaps.length;g++){
    var gz=gaps[g];
    if(worldZ>=gz.a&&worldZ<=gz.b&&spy<10){
      if(!gz.kill){gz.kill=true;hit();}
    }else gz.kill=false;
  }
}

function applyBoost(bt){
  if(bt==='mag')magT=320;
  else if(bt==='inv')invT=320;
  else if(bt==='dbl')dblJ=true;
  else{fish+=25;score+=25;beep(1320,.18,cfg.sfxVol*.4);}
}

function hit(){
  if(invT>0)return;
  lives--;beep(200,.3,cfg.sfxVol*.5);invT=130;
  if(lives<=0){lives=0;setTimeout(endGame,350);}
}

// ── Jump ──────────────────────────────────────────────────────────────────
function doJump(){
  if(gs!=='play')return;
  if(spy===0&&!spJump){spvy=14.5;spJump=true;spJC=1;beep(523,.09,cfg.sfxVol*.32);}
  else if(spJC<2&&dblJ){spvy=12;spJC=2;dblJ=false;beep(659,.09,cfg.sfxVol*.32);burst(W/2+spx*RHW,PY-spy,'#44ffff',6);}
}

// ── Update ────────────────────────────────────────────────────────────────
function update(){
  if(gs!=='play')return;
  spd=Math.min(spd+.00045,13+({easy:0,normal:1,hard:2.5}[cfg.difficulty]||0));
  worldZ+=spd;dist=worldZ/20;
  rcTimer--;
  if(rcTimer<=0){rcTarget=W/2+(Math.random()-.5)*170;rcTimer=110+Math.random()*160;}
  rcX+=(rcTarget-rcX)*.013;
  // horizontal
  var tx=0;
  if(gyroOn){tx=gyroInput();}
  else{
    if(keys['ArrowLeft']||keys['a'])tx=-1;
    else if(keys['ArrowRight']||keys['d'])tx=1;
  }
  spx+=(tx-spx)*.13;spx=Math.max(-1,Math.min(1,spx));
  // vertical
  if(spJump||spy>0){spvy-=.72;spy+=spvy;if(spy<=0){spy=0;spvy=0;spJump=false;spJC=0;}}
  // timers
  if(invT>0)invT--;if(magT>0)magT--;
  if(inkT>0){inkT--;if(inkT===0)document.getElementById('inkScreen').style.background='rgba(15,0,30,0)';}
  // objects
  for(var i=0;i<objs.length;i++)objs[i].wz-=spd;
  for(var i=objs.length-1;i>=0;i--){if(objs[i].wz<-35)objs.splice(i,1);}
  for(var i=gaps.length-1;i>=0;i--){if(worldZ>gaps[i].b+220)gaps.splice(i,1);}
  while(nxtSpawn-worldZ<ZDEPTH*1.05)spawnSeg();
  collide();
  updateHUD();
}

// ── Render ────────────────────────────────────────────────────────────────
function render(){
  ctx.clearRect(0,0,W,H);
  drawSky();
  drawRoad();
  drawObjects();
  drawPenguin();
  drawParticles();
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

// ── Game flow ─────────────────────────────────────────────────────────────
function startGame(){
  initGame();
  gs='play';
  document.getElementById('overlay').style.display='none';
  document.getElementById('gameoverPanel').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('settingsBtn').style.display='block';
  document.getElementById('inkScreen').style.background='rgba(15,0,30,0)';
  startBgm();
}

function endGame(){
  gs='over';
  if(dist>bestDist){bestDist=dist;try{localStorage.setItem('spgb',Math.floor(bestDist));}catch(e){}}
  stopBgm();
  document.getElementById('goDist').textContent='거리: '+Math.floor(dist)+'m';
  document.getElementById('goFish').textContent='물고기: '+fish+'점';
  document.getElementById('goBest').textContent='최고기록: '+Math.floor(bestDist)+'m';
  document.getElementById('gameoverPanel').style.display='flex';
}

// ── UI events ─────────────────────────────────────────────────────────────
document.getElementById('gameCanvas').addEventListener('touchstart',function(e){e.preventDefault();doJump();},{passive:false});
document.getElementById('gameCanvas').addEventListener('mousedown',doJump);

document.getElementById('startBtn').addEventListener('click',function(){
  try{AC().resume();}catch(e){}
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent))reqGyro().then(startGame);
  else startGame();
});
document.getElementById('restartBtn').addEventListener('click',startGame);
document.getElementById('gyroBtn').addEventListener('click',reqGyro);

if(/iPhone|iPad|iPod/i.test(navigator.userAgent))document.getElementById('gyroBtn').style.display='inline-block';

// Settings
document.getElementById('sensSlider').value=cfg.gyroSens;
document.getElementById('bgmSlider').value=cfg.bgmVol;
document.getElementById('sfxSlider').value=cfg.sfxVol;
document.querySelectorAll('.db[data-d]').forEach(function(b){
  b.classList.toggle('on',b.dataset.d===cfg.difficulty);
  b.addEventListener('click',function(){
    cfg.difficulty=b.dataset.d;
    document.querySelectorAll('.db[data-d]').forEach(function(x){x.classList.toggle('on',x===b);});
    saveCfg();
  });
});
document.getElementById('sensSlider').addEventListener('input',function(e){cfg.gyroSens=+e.target.value;saveCfg();});
document.getElementById('bgmSlider').addEventListener('input',function(e){cfg.bgmVol=+e.target.value;saveCfg();});
document.getElementById('sfxSlider').addEventListener('input',function(e){cfg.sfxVol=+e.target.value;saveCfg();});
document.getElementById('settingsBtn').addEventListener('click',function(){document.getElementById('settingsPanel').style.display='block';});
document.getElementById('settingsClose').addEventListener('click',function(){document.getElementById('settingsPanel').style.display='none';});
document.getElementById('recalibBtn').addEventListener('click',calibGyro);

loop();
})();
</script>
