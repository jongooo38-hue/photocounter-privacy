<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>슈퍼펭귄</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#1a3a6a;overflow:hidden;touch-action:none}
#wrap{position:absolute;width:360px;height:640px;transform-origin:top left;overflow:hidden}
#wrap canvas{position:absolute;top:0;left:0;width:360px;height:640px;display:block}
#livesBox{position:absolute;top:8px;left:8px;font-size:26px;font-family:Arial,sans-serif;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));z-index:5}
#centerHud{position:absolute;top:6px;left:50%;transform:translateX(-50%);text-align:center;font-family:Arial,sans-serif;white-space:nowrap;z-index:5}
#distBox{font-size:38px;font-weight:900;color:#fff;-webkit-text-stroke:2px #1a6fbf;text-shadow:0 3px 0 #0d4fa0,0 5px 8px rgba(0,0,0,.4);letter-spacing:-1px;line-height:1}
#bestBox{font-size:13px;color:#fff;font-weight:700;background:rgba(0,80,180,.45);border-radius:8px;padding:1px 8px;margin-top:2px;display:inline-block;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#fishBox{position:absolute;top:10px;right:8px;font-size:20px;font-weight:900;color:#fff;font-family:Arial,sans-serif;-webkit-text-stroke:1px #c06000;text-shadow:0 2px 0 #a04000,0 3px 6px rgba(0,0,0,.4);z-index:5}
#boostBox{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:14px;color:#ffe040;font-family:Arial,sans-serif;font-weight:700;text-shadow:0 0 10px #ff8800,0 2px 4px rgba(0,0,0,.5);white-space:nowrap;z-index:5}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(180deg,rgba(100,180,255,.92) 0%,rgba(50,140,255,.88) 100%);z-index:20;font-family:Arial,sans-serif}
#overlay h1{color:#fff;font-size:36px;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 #0060c0,0 5px 12px rgba(0,0,0,.3);-webkit-text-stroke:1px rgba(255,255,255,.5);margin-bottom:4px}
#overlay .subtitle{color:rgba(255,255,255,.85);font-size:12px;letter-spacing:5px;margin-bottom:26px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.3)}
#overlay p{color:#fff;font-size:13px;margin-bottom:26px;text-align:center;line-height:2;background:rgba(0,80,200,.25);padding:10px 22px;border-radius:14px;border:1px solid rgba(255,255,255,.35);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.btn{padding:14px 44px;font-size:18px;border:none;border-radius:32px;background:linear-gradient(135deg,#ffe040 0%,#ff8c00 100%);color:#fff;cursor:pointer;margin:6px;font-family:Arial,sans-serif;box-shadow:0 4px 0 #c06000,0 6px 16px rgba(0,0,0,.3);font-weight:900;letter-spacing:1px;-webkit-text-stroke:.5px rgba(0,0,0,.2);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c06000,0 2px 8px rgba(0,0,0,.2)}
#gyroBtn{display:none;background:linear-gradient(135deg,#60d0ff,#0080cc)}
#goPanel{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,40,120,.85);z-index:20;font-family:Arial,sans-serif}
#goPanel h2{color:#fff;font-size:32px;font-weight:900;margin-bottom:16px;text-shadow:0 3px 0 #c00,0 4px 10px rgba(0,0,0,.4);-webkit-text-stroke:1px #ff4444}
.goRow{color:#fff;font-size:17px;margin:4px 0;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.4)}
#settingsBtn{position:absolute;bottom:14px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(0,60,180,.65);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:22px;cursor:pointer;z-index:15;display:none;font-family:Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#settingsPanel{position:absolute;bottom:65px;right:12px;width:225px;background:rgba(10,50,150,.97);border:1px solid rgba(100,180,255,.5);border-radius:16px;padding:14px 16px;display:none;z-index:25;font-family:Arial,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#settingsPanel h3{color:#88ccff;font-size:13px;margin-bottom:10px;font-weight:700}
.srow{display:flex;justify-content:space-between;align-items:center;margin:7px 0;color:#cde;font-size:11px}
.srow input[type=range]{width:95px;accent-color:#0af}
.db{padding:3px 9px;border:1.5px solid #0af;border-radius:8px;background:transparent;color:#0af;font-size:10px;cursor:pointer;margin-left:2px;font-family:Arial,sans-serif;font-weight:700}
.db.on{background:#0af;color:#fff}
#settingsClose{display:block;margin:10px auto 0;padding:5px 18px;border:1.5px solid #88ccff;border-radius:10px;background:transparent;color:#88ccff;font-size:11px;cursor:pointer;font-family:Arial,sans-serif;font-weight:700}
#inkScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,0,30,0);pointer-events:none;z-index:8;transition:background .4s}
</style>
</head>
<body>
<div id="wrap">
  <div id="inkScreen"></div>
  <div id="livesBox">❤️❤️❤️</div>
  <div id="centerHud"><div id="distBox">0</div><div id="bestBox">Best: 0m</div></div>
  <div id="fishBox">🐟 0</div>
  <div id="boostBox"></div>
  <div id="overlay">
    <h1>🐧 슈퍼펭귄</h1>
    <div class="subtitle">SUPER PENGUIN</div>
    <p>📱 폰 기울이기 = 좌우 이동<br>👆 화면 터치 = 점프</p>
    <button class="btn" id="startBtn">🎮 시작!</button>
    <button class="btn" id="gyroBtn">자이로 허용 📱</button>
  </div>
  <div id="goPanel">
    <h2>💀 Game Over</h2>
    <div class="goRow" id="goDist"></div>
    <div class="goRow" id="goFish"></div>
    <div class="goRow" id="goBest"></div>
    <button class="btn" style="margin-top:18px" id="restartBtn">🔄 다시 시작</button>
  </div>
  <button id="settingsBtn">⚙️</button>
  <div id="settingsPanel">
    <h3>⚙️ 설정</h3>
    <div class="srow"><span>자이로 민감도</span><input type="range" id="sensSlider" min="1" max="10" step="1" value="6"></div>
    <div class="srow"><span>음악 볼륨</span><input type="range" id="bgmSlider" min="0" max="1" step=".05" value=".7"></div>
    <div class="srow"><span>효과음 볼륨</span><input type="range" id="sfxSlider" min="0" max="1" step=".05" value=".8"></div>
    <div class="srow"><span>난이도</span>
      <span>
        <button class="db on" data-d="easy">쉬움</button>
        <button class="db" data-d="normal">보통</button>
        <button class="db" data-d="hard">어려움</button>
      </span>
    </div>
    <div class="srow"><span>자이로 재보정</span><button class="db" id="recalibBtn">재보정</button></div>
    <button id="settingsClose">닫기</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';

var wrap=document.getElementById('wrap');
function resize(){
  var sc=Math.min(window.innerWidth/360,window.innerHeight/640);
  wrap.style.transform='scale('+sc+')';
  wrap.style.left=Math.round((window.innerWidth-360*sc)/2)+'px';
  wrap.style.top=Math.round((window.innerHeight-640*sc)/2)+'px';
}
resize();
window.addEventListener('resize',resize);

// === THREE.JS RENDERER ===
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(360,640);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
wrap.insertBefore(renderer.domElement,wrap.firstChild);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x4a9fd8);
scene.fog=new THREE.FogExp2(0x87ceeb,0.018);

var camera=new THREE.PerspectiveCamera(60,360/640,0.1,80);
camera.position.set(0,5,9);
camera.lookAt(0,0.5,-5);

// === LIGHTING ===
var ambLight=new THREE.AmbientLight(0xaad4ff,1.0);
scene.add(ambLight);
var sun=new THREE.DirectionalLight(0xfff5dd,1.6);
sun.position.set(6,14,4);
sun.castShadow=true;
sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;
sun.shadow.camera.near=0.1;
sun.shadow.camera.far=80;
sun.shadow.camera.left=-20;
sun.shadow.camera.right=20;
sun.shadow.camera.top=20;
sun.shadow.camera.bottom=-20;
scene.add(sun);
var rimLight=new THREE.DirectionalLight(0x88aaff,0.4);
rimLight.position.set(-4,5,-10);
scene.add(rimLight);

// === SKY SPHERE ===
var skyGeo=new THREE.SphereGeometry(70,16,8);
var skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,
  uniforms:{},
  vertexShader:'varying vec3 vPos;void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 vPos;void main(){float t=clamp((normalize(vPos).y+0.1)*1.2,0.,1.);vec3 top=vec3(0.24,0.55,0.84);vec3 bot=vec3(0.65,0.87,0.96);gl_FragColor=vec4(mix(bot,top,t),1.);}'
});
scene.add(new THREE.Mesh(skyGeo,skyMat));

// Sun sphere
var sunSphere=new THREE.Mesh(
  new THREE.SphereGeometry(2.2,16,12),
  new THREE.MeshBasicMaterial({color:0xfffce0})
);
sunSphere.position.set(25,22,-50);
scene.add(sunSphere);

// Lens glow around sun
var glowGeo=new THREE.SphereGeometry(4,12,8);
var glowMat=new THREE.MeshBasicMaterial({color:0xffee88,transparent:true,opacity:0.18});
var sunGlow=new THREE.Mesh(glowGeo,glowMat);
sunGlow.position.copy(sunSphere.position);
scene.add(sunGlow);

// === CLOUDS ===
function makeCloud(x,y,z,s){
  var g=new THREE.Group();
  var m=new THREE.MeshLambertMaterial({color:0xffffff});
  [[0,0,0,1.8],[-.9,.2,0,1.2],[.9,.15,0,1.1],[.3,-.1,.6,1.0],[-.4,-.1,.5,.9]].forEach(function(d){
    var mesh=new THREE.Mesh(new THREE.SphereGeometry(d[3],8,6),m);
    mesh.position.set(d[0],d[1],d[2]);
    g.add(mesh);
  });
  g.position.set(x,y,z);g.scale.setScalar(s);
  return g;
}
var clouds=[];
[[-8,10,-30,1.6],[4,11,-38,2.0],[-4,9,-22,1.2],[10,12,-28,1.4],[0,13,-42,1.8],[6,9,-18,1.0]].forEach(function(d){
  var c=makeCloud(d[0],d[1],d[2],d[3]);
  scene.add(c);
  clouds.push(c);
});

// === CONSTANTS ===
var ROAD_HW=2.5;
var SEG_LEN=2.5;
var N_SEGS=18;
var PLAYER_Z=4.0;
var WZ_SCALE=0.08;
var OBJ_SPAWN_WZ=480;

// === MATERIALS ===
var matRoad0=new THREE.MeshLambertMaterial({color:0xe0f0ff});
var matRoad1=new THREE.MeshLambertMaterial({color:0xeef8ff});
var matGap=new THREE.MeshLambertMaterial({color:0x0d5080});
var matSea=new THREE.MeshLambertMaterial({color:0x1a80c0});
var matSnowBank=new THREE.MeshPhongMaterial({color:0xffffff,shininess:30});
var matIce=new THREE.MeshPhongMaterial({color:0xa8d8f0,transparent:true,opacity:0.88,shininess:140});
var matDoor=new THREE.MeshPhongMaterial({color:0x7a4810,shininess:20});
var matOcto=new THREE.MeshPhongMaterial({color:0x9933cc,shininess:80});
var matOrange=new THREE.MeshPhongMaterial({color:0xff7700,shininess:40});

// === BIG SEA FLOOR ===
var bigSea=new THREE.Mesh(new THREE.PlaneGeometry(120,120),matSea);
bigSea.rotation.x=-Math.PI/2;
bigSea.position.y=-0.05;
scene.add(bigSea);

// === ROAD SEGMENTS ===
var roadSegs=[];
for(var _i=0;_i<N_SEGS;_i++){
  var sg=buildRoadSeg(_i);
  sg.z3D=PLAYER_Z-_i*SEG_LEN;
  sg.group.position.z=sg.z3D;
  scene.add(sg.group);
  roadSegs.push(sg);
}
function buildRoadSeg(idx){
  var g=new THREE.Group();
  var road=new THREE.Mesh(new THREE.PlaneGeometry(ROAD_HW*2,SEG_LEN),idx%2===0?matRoad0:matRoad1);
  road.rotation.x=-Math.PI/2;road.receiveShadow=true;
  g.add(road);g._road=road;g._roadIdx=idx;
  // Snow banks
  var bkL=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.28,SEG_LEN),matSnowBank);
  bkL.position.set(-ROAD_HW-0.22,0.14,0);bkL.castShadow=true;bkL.receiveShadow=true;g.add(bkL);
  var bkR=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.28,SEG_LEN),matSnowBank);
  bkR.position.set(ROAD_HW+0.22,0.14,0);bkR.castShadow=true;bkR.receiveShadow=true;g.add(bkR);
  g._banks=[bkL,bkR];
  return{group:g,z3D:0,isGap:false,idx:idx};
}
function setSegGap(seg,isGap){
  if(seg.isGap===isGap)return;
  seg.isGap=isGap;
  seg.group._road.material=isGap?matGap:(seg.idx%2===0?matRoad0:matRoad1);
  seg.group._banks.forEach(function(b){b.visible=!isGap;});
}

// === DISTANT ICEBERGS (sides) ===
var sideIcebergs=[];
function makeSideIceberg(){
  var g=new THREE.Group();
  var h=1.5+Math.random()*2;
  var geo=new THREE.ConeGeometry(0.8+Math.random()*0.5,h,5+Math.floor(Math.random()*3));
  var mat=new THREE.MeshPhongMaterial({color:0xc0e0f8,shininess:40});
  var m=new THREE.Mesh(geo,mat);m.position.y=h/2;m.castShadow=true;g.add(m);
  // Snowy top cap
  var cap=new THREE.Mesh(new THREE.ConeGeometry(0.3,0.4,5),new THREE.MeshPhongMaterial({color:0xffffff,shininess:20}));
  cap.position.y=h;g.add(cap);
  return g;
}
for(var _j=0;_j<14;_j++){
  var ib=makeSideIceberg();
  ib.position.x=(_j%2===0?-1:1)*(5+Math.random()*5);
  ib.position.z=-_j*4.5-5;
  scene.add(ib);
  sideIcebergs.push(ib);
}

// === PENGUIN ===
function buildPenguin(){
  var g=new THREE.Group();
  var darkBlue=new THREE.MeshPhongMaterial({color:0x0d2060,shininess:60});
  var cream=new THREE.MeshPhongMaterial({color:0xfffce8,shininess:20});
  var orange=new THREE.MeshPhongMaterial({color:0xff8800,shininess:60});
  var white=new THREE.MeshBasicMaterial({color:0xffffff});
  var black=new THREE.MeshBasicMaterial({color:0x0a0a20});

  // Body
  var body=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.48,1.05,14),darkBlue);
  body.position.y=0.52;body.castShadow=true;g.add(body);
  // Belly
  var belly=new THREE.Mesh(new THREE.SphereGeometry(0.32,10,8),cream);
  belly.scale.set(1,1.1,0.5);belly.position.set(0,0.45,0.32);g.add(belly);
  // Head
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.4,12,10),darkBlue);
  head.position.y=1.22;head.castShadow=true;g.add(head);
  // Eyes
  var eyeL=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,6),white);eyeL.position.set(-0.16,1.28,0.3);g.add(eyeL);
  var eyeR=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,6),white);eyeR.position.set(0.16,1.28,0.3);g.add(eyeR);
  var pupL=new THREE.Mesh(new THREE.SphereGeometry(0.062,6,4),black);pupL.position.set(-0.13,1.28,0.38);g.add(pupL);
  var pupR=new THREE.Mesh(new THREE.SphereGeometry(0.062,6,4),black);pupR.position.set(0.19,1.28,0.38);g.add(pupR);
  // Shine in eye
  var shL=new THREE.Mesh(new THREE.SphereGeometry(0.03,4,3),white);shL.position.set(-0.11,1.31,0.4);g.add(shL);
  var shR=new THREE.Mesh(new THREE.SphereGeometry(0.03,4,3),white);shR.position.set(0.21,1.31,0.4);g.add(shR);
  // Beak
  var beak=new THREE.Mesh(new THREE.ConeGeometry(0.085,0.28,8),orange);
  beak.rotation.x=Math.PI/2;beak.position.set(0,1.17,0.5);g.add(beak);
  // Arms
  var armGeo=new THREE.BoxGeometry(0.14,0.58,0.12);
  var armL=new THREE.Mesh(armGeo,darkBlue);armL.position.set(-0.5,0.6,0);armL.rotation.z=0.5;armL.castShadow=true;g.add(armL);g._armL=armL;
  var armR=new THREE.Mesh(armGeo,darkBlue);armR.position.set(0.5,0.6,0);armR.rotation.z=-0.5;armR.castShadow=true;g.add(armR);g._armR=armR;
  // Crown
  var crownBase=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.3,0.12,6),new THREE.MeshPhongMaterial({color:0xffcc00,shininess:120}));
  crownBase.position.y=1.55;g.add(crownBase);
  for(var cp=0;cp<6;cp++){
    var spike=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.22,5),new THREE.MeshPhongMaterial({color:0xffdd00,shininess:120}));
    spike.position.y=1.72;
    spike.position.x=Math.cos(cp/6*Math.PI*2)*0.2;
    spike.position.z=Math.sin(cp/6*Math.PI*2)*0.2;
    g.add(spike);
  }
  // Feet
  var footGeo=new THREE.BoxGeometry(0.26,0.09,0.36);
  var footL=new THREE.Mesh(footGeo,orange);footL.position.set(-0.22,0.045,0.15);g.add(footL);g._footL=footL;
  var footR=new THREE.Mesh(footGeo,orange);footR.position.set(0.22,0.045,0.15);g.add(footR);g._footR=footR;
  return g;
}
var penguin=buildPenguin();
penguin.position.set(0,0,PLAYER_Z);
scene.add(penguin);

// === SNOW PARTICLES ===
var SNOW_N=300;
var snowPos=new Float32Array(SNOW_N*3);
var snowSpd=[];
for(var _s=0;_s<SNOW_N;_s++){
  snowPos[_s*3]=(Math.random()-0.5)*30;
  snowPos[_s*3+1]=Math.random()*22;
  snowPos[_s*3+2]=(Math.random()-0.5)*25+PLAYER_Z;
  snowSpd.push(0.04+Math.random()*0.06);
}
var snowGeo=new THREE.BufferGeometry();
snowGeo.setAttribute('position',new THREE.BufferAttribute(snowPos,3));
var snowPts=new THREE.Points(snowGeo,new THREE.PointsMaterial({color:0xffffff,size:0.12,sizeAttenuation:true,transparent:true,opacity:0.8}));
scene.add(snowPts);

// === BURST PARTICLES ===
var bursts=[];
var burstGroup=new THREE.Group();scene.add(burstGroup);

function burst3D(x,y,z,col,n){
  n=n||8;
  for(var i=0;i<n;i++){
    var mesh=new THREE.Mesh(new THREE.SphereGeometry(0.07,4,3),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:1}));
    mesh.position.set(x,y,z);burstGroup.add(mesh);
    var a=Math.random()*Math.PI*2,spd=0.06+Math.random()*0.12;
    bursts.push({mesh:mesh,vx:Math.cos(a)*spd,vy:0.06+Math.random()*0.1,vz:Math.sin(a)*spd*0.4,life:1});
  }
}

// === GAME OBJECT MESHES ===
function mkFish(ft){
  var g=new THREE.Group();
  if(ft==='d'){
    var dm=new THREE.Mesh(new THREE.OctahedronGeometry(0.3),new THREE.MeshPhongMaterial({color:0x55bbff,shininess:200,transparent:true,opacity:0.92}));
    g.add(dm);
  }else{
    var cols={o:0xe06600,b:0x1155ee,g:0x119933};var col=cols[ft]||0x5599ff;
    var body=new THREE.Mesh(new THREE.SphereGeometry(0.24,10,8),new THREE.MeshPhongMaterial({color:col,shininess:60}));
    body.scale.set(1.5,0.85,0.65);g.add(body);
    var tail=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.32,4),new THREE.MeshPhongMaterial({color:col}));
    tail.rotation.z=Math.PI/2;tail.position.x=-0.42;g.add(tail);
    if(ft==='o'){
      var stripe=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,4),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.8}));
      stripe.scale.set(0.4,1.8,0.5);stripe.position.set(0.05,0,0.1);g.add(stripe);
    }
    var eye=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,4),new THREE.MeshBasicMaterial({color:0xffffff}));
    eye.position.set(0.3,0.08,0.18);g.add(eye);
  }
  return g;
}
function mkIceberg(){
  var g=new THREE.Group();
  var m=new THREE.Mesh(new THREE.ConeGeometry(0.42,1.3,6),matIce);
  m.position.y=0.65;m.castShadow=true;g.add(m);
  var shine=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.5,3),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.55}));
  shine.position.set(-0.1,0.9,0.15);shine.rotation.z=0.3;g.add(shine);
  return g;
}
function mkOcto(){
  var g=new THREE.Group();
  var body=new THREE.Mesh(new THREE.SphereGeometry(0.52,12,10),matOcto);
  body.position.y=0.52;body.castShadow=true;g.add(body);
  var eyeM=new THREE.MeshBasicMaterial({color:0xffffff});
  var pupM=new THREE.MeshBasicMaterial({color:0x220044});
  [-0.18,0.18].forEach(function(ex){
    var e=new THREE.Mesh(new THREE.SphereGeometry(0.1,6,4),eyeM);e.position.set(ex,0.6,0.44);g.add(e);
    var p=new THREE.Mesh(new THREE.SphereGeometry(0.06,4,3),pupM);p.position.set(ex,0.6,0.5);g.add(p);
  });
  var tM=new THREE.MeshPhongMaterial({color:0x7722bb});
  for(var t=0;t<6;t++){
    var a=t/6*Math.PI*2;
    var tent=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.025,0.85,4),tM);
    tent.position.set(Math.cos(a)*0.38,0.06,Math.sin(a)*0.38);
    tent.rotation.x=Math.sin(a)*0.5;tent.rotation.z=Math.cos(a)*0.5;
    g.add(tent);
  }
  return g;
}
function mkDoor(){
  var g=new THREE.Group();
  [-0.5,0.5].forEach(function(side){
    var panel=new THREE.Mesh(new THREE.BoxGeometry(0.92,2.1,0.16),matDoor);
    panel.position.set(side*0.5,1.05,0);panel.castShadow=true;g.add(panel);
    for(var row=0;row<3;row++){
      var det=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.46,0.05),new THREE.MeshPhongMaterial({color:0x5c3008}));
      det.position.set(side*0.5,0.3+row*0.65,0.1);g.add(det);
    }
  });
  return g;
}
function mkBoost(bt){
  var cols={mag:0xff3333,inv:0xffee00,dbl:0x00dddd,chest:0xffcc00};var c=cols[bt]||0xff88ff;
  var g=new THREE.Group();
  var m=new THREE.Mesh(new THREE.SphereGeometry(0.3,12,10),new THREE.MeshPhongMaterial({color:c,shininess:120,emissive:c,emissiveIntensity:0.25}));
  g.add(m);
  return g;
}

// === AUDIO ===
var actx=null;
function AC(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
var bgmTimer=null,bgmRunning=false,bgmIdx=0;
var MEL=[784,0,1047,784,880,0,1047,880,988,0,880,784,659,0,784,659,698,0,880,698,784,0,1047,784,880,659,784,0,523,659,784,0];
var BAS=[131,0,131,0,196,0,196,0,165,0,165,0,196,0,196,0,175,0,175,0,131,0,131,0,196,0,165,0,131,0,131,0];
var DRM=['K','-','H','-','S','-','H','-','K','-','H','-','S','-','H','-','K','-','H','-','S','-','H','-','K','H','K','H','S','-','H','-'];
function tone(f,type,vol,dur){try{var a=AC(),o=a.createOscillator(),g=a.createGain();o.type=type;o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.start();o.stop(a.currentTime+dur+.01);}catch(e){}}
function noiseFx(ftype,freq,vol,dur){try{var a=AC(),n=Math.ceil(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;f.type=ftype;f.frequency.value=freq;s.connect(f);f.connect(g);g.connect(a.destination);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);s.start();}catch(e){}}
function kick(){noiseFx('lowpass',150,.5,.15);}
function snare(){noiseFx('bandpass',2000,.35,.1);}
function hihat(){noiseFx('highpass',7000,.15,.04);}
function beep(f,d,v){tone(f,'sine',v||.3,d||.1);}
function bgmTick(){var v=cfg.bgmVol;if(MEL[bgmIdx])tone(MEL[bgmIdx],'triangle',.08*v,.13);if(BAS[bgmIdx])tone(BAS[bgmIdx],'sine',.06*v,.13);var dr=DRM[bgmIdx];if(dr==='K')kick();else if(dr==='S')snare();else if(dr==='H')hihat();bgmIdx=(bgmIdx+1)%MEL.length;}
function startBgm(){if(bgmRunning)return;bgmRunning=true;bgmIdx=0;bgmTimer=setInterval(bgmTick,150);}
function stopBgm(){clearInterval(bgmTimer);bgmRunning=false;}

// === GYRO ===
var gyroOn=false,gyroVal=0,gyroBL=0;
function setupGyro(){window.addEventListener('deviceorientation',function(e){if(e.gamma!=null)gyroVal=e.gamma;});gyroOn=true;}
function calibGyro(){gyroBL=gyroVal;}
function gyroInput(){var raw=gyroVal-gyroBL,dead=10,mx=gyroMax();if(Math.abs(raw)<dead)return 0;return Math.max(-1,Math.min(1,(Math.abs(raw)-dead)/(mx-dead)*(raw>0?1:-1)));}
async function reqGyro(){if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{if(await DeviceOrientationEvent.requestPermission()==='granted'){setupGyro();setTimeout(calibGyro,200);}}catch(e){}}else{setupGyro();setTimeout(calibGyro,200);}}

var keys={};
window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();doJump();}});
window.addEventListener('keyup',function(e){keys[e.key]=false;});

// === CONFIG ===
var cfg={gyroSens:6,bgmVol:.70,sfxVol:.80,difficulty:'easy'};
try{var _sc=localStorage.getItem('spg');if(_sc)cfg=Object.assign(cfg,JSON.parse(_sc));}catch(e){}
function saveCfg(){try{localStorage.setItem('spg',JSON.stringify(cfg));}catch(e){}}
function gyroMax(){return 62-(cfg.gyroSens-1)*5;}

// === GAME STATE ===
var gs='menu',dist,fishCnt,lives,worldZ,spd;
var spx,spy,spvy,spJump,spJC,invT,inkT,magT,dblJ;
var rcX,rcTarget,rcTimer,rcDir,objs,gaps,nxtSpawn;
var bestDist=0;
try{bestDist=parseInt(localStorage.getItem('spgb')||'0');}catch(e){}
var activeObjs=[];

function wz2z(wz){return PLAYER_Z-wz*WZ_SCALE;}
function fcol(ft){
  if(ft==='o')return{col:0xe06600,p:1};
  if(ft==='b')return{col:0x1155ee,p:3};
  if(ft==='g')return{col:0x119933,p:5};
  return{col:0x66aaff,p:10};
}

function initGame(){
  dist=0;fishCnt=0;lives=3;worldZ=0;
  spd=3.5+({easy:0,normal:.5,hard:1}[cfg.difficulty]||0);
  spx=0;spy=0;spvy=0;spJump=false;spJC=0;
  invT=0;inkT=0;magT=0;dblJ=false;
  rcX=0;rcTarget=0;rcTimer=0;rcDir=1;
  objs=[];gaps=[];nxtSpawn=140;
  activeObjs.forEach(function(ao){scene.remove(ao.mesh);});activeObjs=[];
  bursts.forEach(function(b){burstGroup.remove(b.mesh);});bursts.length=0;
  penguin.position.set(0,0,PLAYER_Z);penguin.visible=true;
}

function spawnSeg(){
  var oR={easy:.22,normal:.38,hard:.52}[cfg.difficulty]||.22;
  var gapSz={easy:190,normal:150,hard:110}[cfg.difficulty]||190;
  if(Math.random()>=oR){
    var fts=['o','o','o','b','b','g','d'];
    var n=2+Math.floor(Math.random()*4);
    var rxs=[-0.65,-0.35,0,0.35,0.65].sort(function(){return Math.random()-.5;}).slice(0,n);
    for(var i=0;i<n;i++){
      var fo={k:'fish',ft:fts[Math.floor(Math.random()*fts.length)],wz:nxtSpawn+Math.random()*25,rx:rxs[i],got:false};
      objs.push(fo);spawnMesh(fo);
    }
    if(Math.random()<.1){
      var bts=['mag','inv','dbl','chest'];
      var bo={k:'boost',bt:bts[Math.floor(Math.random()*bts.length)],wz:nxtSpawn+55,rx:(Math.random()-.5)*.75,got:false};
      objs.push(bo);spawnMesh(bo);
    }
  }else{
    var ot=Math.random();
    if(ot<.32){
      var nc=1+Math.floor(Math.random()*2);
      for(var j=0;j<nc;j++){var rx2=(Math.random()-.5)*1.35;var io={k:'ice',wz:nxtSpawn,rx:rx2,hit:false};objs.push(io);spawnMesh(io);}
    }else if(ot<.56){
      var gMin=worldZ+nxtSpawn-15,gMax=gMin+75+Math.random()*55;
      gaps.push({a:gMin,b:gMax,kill:false});
    }else if(ot<.78){
      var oo={k:'octo',wz:nxtSpawn,rx:(Math.random()-.5)*.85,hit:false};objs.push(oo);spawnMesh(oo);
    }else{
      var do2={k:'door',wz:nxtSpawn,rx:(Math.random()<.5?-.4:.4),hit:false};objs.push(do2);spawnMesh(do2);
    }
  }
  nxtSpawn+=gapSz+Math.random()*75;
}

function spawnMesh(obj){
  var mesh;
  if(obj.k==='fish')mesh=mkFish(obj.ft);
  else if(obj.k==='ice')mesh=mkIceberg();
  else if(obj.k==='octo')mesh=mkOcto();
  else if(obj.k==='door')mesh=mkDoor();
  else if(obj.k==='boost')mesh=mkBoost(obj.bt);
  else return;
  mesh.position.set(rcX+obj.rx*ROAD_HW,obj.k==='fish'||obj.k==='boost'?0.35:0,wz2z(obj.wz));
  scene.add(mesh);
  activeObjs.push({mesh:mesh,obj:obj});
}

function updateHUD(){
  document.getElementById('livesBox').textContent='❤️'.repeat(Math.max(0,lives));
  document.getElementById('distBox').textContent=Math.floor(dist)+'m';
  document.getElementById('bestBox').textContent='Best: '+Math.floor(bestDist)+'m';
  document.getElementById('fishBox').textContent='🐟 '+fishCnt;
  var bt='';if(magT>0)bt+='🧲 ';if(invT>0)bt+='⭐ ';if(dblJ)bt+='🔼 ';
  document.getElementById('boostBox').textContent=bt;
}

function collide(){
  for(var i=0;i<objs.length;i++){
    var o=objs[i];if(o.got||o.hit)continue;if(o.wz>15||o.wz<-5)continue;
    var dx=Math.abs(spx-o.rx);
    if(o.k==='fish'&&dx<.19){o.got=true;var fc=fcol(o.ft);fishCnt+=fc.p;beep(880,.07,cfg.sfxVol*.3);burst3D(penguin.position.x,0.5,PLAYER_Z,fc.col);}
    else if(o.k==='boost'&&dx<.21){o.got=true;applyBoost(o.bt);beep(1047,.12,cfg.sfxVol*.28);burst3D(penguin.position.x,0.5,PLAYER_Z,0xffee88,12);}
    else if(o.k==='ice'&&dx<.15&&spy<18){o.hit=true;hitPlayer();}
    else if(o.k==='octo'&&dx<.22){o.hit=true;inkT=200;document.getElementById('inkScreen').style.background='rgba(15,0,30,.85)';hitPlayer();}
    else if(o.k==='door'&&dx<.21&&spy<12){o.hit=true;hitPlayer();}
    if(magT>0&&o.k==='fish'&&!o.got&&o.wz<85)o.rx+=(spx-o.rx)*.09;
  }
  for(var gi=0;gi<gaps.length;gi++){
    var gz=gaps[gi];
    if(worldZ>=gz.a&&worldZ<=gz.b&&spy<10){if(!gz.kill){gz.kill=true;hitPlayer();}}else gz.kill=false;
  }
}
function applyBoost(bt){if(bt==='mag')magT=320;else if(bt==='inv')invT=320;else if(bt==='dbl')dblJ=true;else{fishCnt+=25;beep(1320,.18,cfg.sfxVol*.4);}}
function hitPlayer(){if(invT>0)return;lives--;beep(200,.3,cfg.sfxVol*.5);invT=130;if(lives<=0){lives=0;setTimeout(endGame,350);}}
function doJump(){
  if(gs!=='play')return;
  if(spy===0&&!spJump){spvy=14.5;spJump=true;spJC=1;beep(523,.09,cfg.sfxVol*.32);}
  else if(spJC<2&&dblJ){spvy=12;spJC=2;dblJ=false;beep(659,.09,cfg.sfxVol*.32);burst3D(penguin.position.x,penguin.position.y,PLAYER_Z,0x44ffff,6);}
}

var _camX=0;
function update(){
  if(gs!=='play')return;
  spd=Math.min(spd+.00045,13);worldZ+=spd;dist=worldZ/20;

  // Curve
  rcTimer--;
  if(rcTimer<=0){rcDir=-rcDir;rcTarget=rcDir*(1.0+Math.random()*1.2);rcTimer=70+Math.random()*90;}
  rcX+=(rcTarget-rcX)*.022;

  // Input
  var tx=0;
  if(gyroOn)tx=gyroInput();
  else if(keys['ArrowLeft']||keys['a'])tx=-1;
  else if(keys['ArrowRight']||keys['d'])tx=1;
  spx+=(tx-spx)*.13;spx=Math.max(-1,Math.min(1,spx));

  // Jump
  if(spJump||spy>0){spvy-=.72;spy+=spvy;if(spy<=0){spy=0;spvy=0;spJump=false;spJC=0;}}
  if(invT>0)invT--;if(magT>0)magT--;
  if(inkT>0){inkT--;if(inkT===0)document.getElementById('inkScreen').style.background='rgba(15,0,30,0)';}

  // Advance game objs
  for(var i=0;i<objs.length;i++)objs[i].wz-=spd;
  for(var i=objs.length-1;i>=0;i--){if(objs[i].wz<-30)objs.splice(i,1);}
  for(var i=gaps.length-1;i>=0;i--){if(worldZ>gaps[i].b+220)gaps.splice(i,1);}
  while(nxtSpawn-worldZ<OBJ_SPAWN_WZ*1.05)spawnSeg();

  collide();updateHUD();

  // === 3D UPDATES ===
  var penX=rcX+spx*ROAD_HW;
  var penY=spy*0.055;
  penguin.position.x+=(penX-penguin.position.x)*.25;
  penguin.position.y=penY;
  penguin.rotation.z=-spx*.18;
  penguin.rotation.y=tx*.12;
  var t=Date.now()*.001;
  if(penguin._armL)penguin._armL.rotation.z=0.5+Math.sin(t*5)*.25;
  if(penguin._armR)penguin._armR.rotation.z=-0.5-Math.sin(t*5)*.25;
  if(penguin._footL)penguin._footL.position.z=0.15+Math.sin(t*7)*.1;
  if(penguin._footR)penguin._footR.position.z=0.15-Math.sin(t*7)*.1;
  penguin.visible=invT<=0||Math.floor(invT/5)%2===0;

  // Camera
  _camX+=((rcX*.3)-_camX)*.04;
  camera.position.x=_camX;
  camera.lookAt(_camX*.5,0.5,-3);

  // Road scroll
  var dz=spd*WZ_SCALE;
  roadSegs.forEach(function(seg){
    seg.z3D+=dz;
    if(seg.z3D>PLAYER_Z+SEG_LEN){
      seg.z3D-=N_SEGS*SEG_LEN;
    }
    // Curve: near=full rcX, far=less
    var depth=PLAYER_Z-seg.z3D;
    var curveFactor=Math.max(0,1-depth/(N_SEGS*SEG_LEN));
    seg.group.position.set(rcX*curveFactor,0,seg.z3D);
    // Gap check
    var segGameZ=worldZ+depth/WZ_SCALE;
    var isGap=false;
    for(var gi=0;gi<gaps.length;gi++){if(segGameZ>=gaps[gi].a&&segGameZ<=gaps[gi].b){isGap=true;break;}}
    setSegGap(seg,isGap);
  });

  // Side icebergs scroll for parallax
  sideIcebergs.forEach(function(ib){
    ib.position.z+=dz*0.4;
    if(ib.position.z>PLAYER_Z+5){
      ib.position.z-=14*4.5+5;
      ib.position.x=(Math.random()>.5?1:-1)*(5+Math.random()*5);
    }
  });

  // Clouds drift
  clouds.forEach(function(c,ci){c.position.x+=0.004;if(c.position.x>20)c.position.x=-20;});

  // Active 3D objs
  var toRemove=[];
  activeObjs.forEach(function(ao){
    if(ao.obj.got||ao.obj.hit){toRemove.push(ao);return;}
    var wz=ao.obj.wz;
    var wx=rcX+ao.obj.rx*ROAD_HW;
    var wz3=wz2z(wz);
    var wy=ao.obj.k==='fish'||ao.obj.k==='boost'?0.35+Math.sin(t*3+ao.obj.rx*5)*.12:0;
    ao.mesh.position.set(wx,wy,wz3);
    ao.mesh.visible=wz3<PLAYER_Z+1&&wz>-15;
    if(ao.obj.k==='fish'||ao.obj.k==='boost')ao.mesh.rotation.y+=0.05;
    if(ao.obj.k==='octo')ao.mesh.rotation.y+=0.015;
  });
  toRemove.forEach(function(ao){scene.remove(ao.mesh);activeObjs.splice(activeObjs.indexOf(ao),1);});

  // Bursts
  for(var bi=bursts.length-1;bi>=0;bi--){
    var b=bursts[bi];
    b.mesh.position.x+=b.vx;b.mesh.position.y+=b.vy;b.mesh.position.z+=b.vz;
    b.vy-=0.006;b.life-=0.035;
    b.mesh.material.opacity=b.life;
    if(b.life<=0){burstGroup.remove(b.mesh);bursts.splice(bi,1);}
  }

  // Snow
  var sp=snowGeo.attributes.position;
  for(var si=0;si<SNOW_N;si++){
    sp.array[si*3+1]-=snowSpd[si];
    sp.array[si*3]+=Math.sin(t*0.8+si)*.01;
    if(sp.array[si*3+1]<-1){sp.array[si*3+1]=20;sp.array[si*3]=(Math.random()-.5)*30;}
  }
  sp.needsUpdate=true;
}

function loop(){update();renderer.render(scene,camera);requestAnimationFrame(loop);}

function startGame(){
  initGame();gs='play';
  document.getElementById('overlay').style.display='none';
  document.getElementById('goPanel').style.display='none';
  document.getElementById('settingsBtn').style.display='block';
  document.getElementById('inkScreen').style.background='rgba(15,0,30,0)';
  startBgm();
}
function endGame(){
  gs='over';if(dist>bestDist){bestDist=dist;try{localStorage.setItem('spgb',Math.floor(bestDist));}catch(e){}}
  stopBgm();
  document.getElementById('goDist').textContent='거리: '+Math.floor(dist)+'m';
  document.getElementById('goFish').textContent='물고기: '+fishCnt+'점';
  document.getElementById('goBest').textContent='최고기록: '+Math.floor(bestDist)+'m';
  document.getElementById('goPanel').style.display='flex';
}

renderer.domElement.addEventListener('touchstart',function(e){e.preventDefault();doJump();},{passive:false});
renderer.domElement.addEventListener('mousedown',doJump);
document.getElementById('startBtn').addEventListener('click',function(){
  try{AC().resume();}catch(e){}
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent))reqGyro().then(startGame);
  else{if(!gyroOn){setupGyro();setTimeout(calibGyro,300);}startGame();}
});
document.getElementById('restartBtn').addEventListener('click',function(){
  if(!gyroOn&&!/iPhone|iPad|iPod/i.test(navigator.userAgent)){setupGyro();setTimeout(calibGyro,300);}
  startGame();
});
document.getElementById('gyroBtn').addEventListener('click',reqGyro);
if(/iPhone|iPad|iPod/i.test(navigator.userAgent))document.getElementById('gyroBtn').style.display='inline-block';

document.getElementById('sensSlider').value=cfg.gyroSens;
document.getElementById('bgmSlider').value=cfg.bgmVol;
document.getElementById('sfxSlider').value=cfg.sfxVol;
document.querySelectorAll('.db[data-d]').forEach(function(b){
  b.classList.toggle('on',b.dataset.d===cfg.difficulty);
  b.addEventListener('click',function(){cfg.difficulty=b.dataset.d;document.querySelectorAll('.db[data-d]').forEach(function(x){x.classList.toggle('on',x===b);});saveCfg();});
});
document.getElementById('sensSlider').addEventListener('input',function(e){cfg.gyroSens=+e.target.value;saveCfg();});
document.getElementById('bgmSlider').addEventListener('input',function(e){cfg.bgmVol=+e.target.value;saveCfg();});
document.getElementById('sfxSlider').addEventListener('input',function(e){cfg.sfxVol=+e.target.value;saveCfg();});
document.getElementById('settingsBtn').addEventListener('click',function(){document.getElementById('settingsPanel').style.display='block';});
document.getElementById('settingsClose').addEventListener('click',function(){document.getElementById('settingsPanel').style.display='none';});
document.getElementById('recalibBtn').addEventListener('click',calibGyro);

initGame();
loop();
})();
</script>
