<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>슈퍼펭귄</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#87ceeb;overflow:hidden;touch-action:none}
#wrap{position:absolute;width:360px;height:640px;transform-origin:top left;overflow:hidden}
canvas{display:block;width:360px;height:640px}
#livesBox{position:absolute;top:8px;left:8px;font-size:26px;font-family:Arial,sans-serif;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#centerHud{position:absolute;top:6px;left:50%;transform:translateX(-50%);text-align:center;font-family:Arial,sans-serif;white-space:nowrap}
#distBox{font-size:38px;font-weight:900;color:#fff;-webkit-text-stroke:2px #1a6fbf;text-shadow:0 3px 0 #0d4fa0,0 5px 8px rgba(0,0,0,.4);letter-spacing:-1px;line-height:1}
#bestBox{font-size:13px;color:#fff;font-weight:700;background:rgba(0,80,180,.45);border-radius:8px;padding:1px 8px;margin-top:2px;display:inline-block;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#fishBox{position:absolute;top:10px;right:8px;font-size:20px;font-weight:900;color:#fff;font-family:Arial,sans-serif;-webkit-text-stroke:1px #c06000;text-shadow:0 2px 0 #a04000,0 3px 6px rgba(0,0,0,.4)}
#boostBox{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:14px;color:#ffe040;font-family:Arial,sans-serif;font-weight:700;text-shadow:0 0 10px #ff8800,0 2px 4px rgba(0,0,0,.5);white-space:nowrap}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(180deg,rgba(100,180,255,.92) 0%,rgba(50,140,255,.88) 100%);z-index:20;font-family:Arial,sans-serif}
#overlay h1{color:#fff;font-size:36px;font-weight:900;letter-spacing:1px;text-shadow:0 3px 0 #0060c0,0 5px 12px rgba(0,0,0,.3);-webkit-text-stroke:1px rgba(255,255,255,.5);margin-bottom:4px}
#overlay .subtitle{color:rgba(255,255,255,.85);font-size:12px;letter-spacing:5px;margin-bottom:26px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.3)}
#overlay p{color:#fff;font-size:13px;margin-bottom:26px;text-align:center;line-height:2;background:rgba(0,80,200,.25);padding:10px 22px;border-radius:14px;border:1px solid rgba(255,255,255,.35);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.btn{padding:14px 44px;font-size:18px;border:none;border-radius:32px;background:linear-gradient(135deg,#ffe040 0%,#ff8c00 100%);color:#fff;cursor:pointer;margin:6px;font-family:Arial,sans-serif;box-shadow:0 4px 0 #c06000,0 6px 16px rgba(0,0,0,.3);font-weight:900;letter-spacing:1px;-webkit-text-stroke:.5px rgba(0,0,0,.2);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c06000,0 2px 8px rgba(0,0,0,.2)}
#gyroBtn{display:none;background:linear-gradient(135deg,#60d0ff,#0080cc)}
#goPanel{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,40,120,.85);z-index:20;font-family:Arial,sans-serif}
#goPanel h2{color:#fff;font-size:32px;font-weight:900;margin-bottom:16px;text-shadow:0 3px 0 #c00,0 4px 10px rgba(0,0,0,.4);-webkit-text-stroke:1px #ff4444}
.goRow{color:#fff;font-size:17px;margin:4px 0;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.4)}
#settingsBtn{position:absolute;bottom:14px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(0,60,180,.65);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:22px;cursor:pointer;z-index:15;display:none;font-family:Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#settingsPanel{position:absolute;bottom:65px;right:12px;width:225px;background:rgba(10,50,150,.97);border:1px solid rgba(100,180,255,.5);border-radius:16px;padding:14px 16px;display:none;z-index:25;font-family:Arial,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#settingsPanel h3{color:#88ccff;font-size:13px;margin-bottom:10px;font-weight:700}
.srow{display:flex;justify-content:space-between;align-items:center;margin:7px 0;color:#cde;font-size:11px}
.srow input[type=range]{width:95px;accent-color:#0af}
.db{padding:3px 9px;border:1.5px solid #0af;border-radius:8px;background:transparent;color:#0af;font-size:10px;cursor:pointer;margin-left:2px;font-family:Arial,sans-serif;font-weight:700}
.db.on{background:#0af;color:#fff}
#settingsClose{display:block;margin:10px auto 0;padding:5px 18px;border:1.5px solid #88ccff;border-radius:10px;background:transparent;color:#88ccff;font-size:11px;cursor:pointer;font-family:Arial,sans-serif;font-weight:700}
#inkScreen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(15,0,30,0);pointer-events:none;z-index:8;transition:background .4s}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="640"></canvas>
  <div id="inkScreen"></div>
  <div id="livesBox">❤️❤️❤️</div>
  <div id="centerHud"><div id="distBox">0</div><div id="bestBox">Best: 0m</div></div>
  <div id="fishBox">🐟 0</div>
  <div id="boostBox"></div>
  <div id="overlay">
    <h1>🐧 슈퍼펭귄</h1>
    <div class="subtitle">SUPER PENGUIN</div>
    <p>📱 폰 기울이기 = 좌우 이동<br>👆 화면 터치 = 점프</p>
    <button class="btn" id="startBtn">🎮 시작!</button>
    <button class="btn" id="gyroBtn">자이로 허용 📱</button>
  </div>
  <div id="goPanel">
    <h2>💀 Game Over</h2>
    <div class="goRow" id="goDist"></div>
    <div class="goRow" id="goFish"></div>
    <div class="goRow" id="goBest"></div>
    <button class="btn" style="margin-top:18px" id="restartBtn">🔄 다시 시작</button>
  </div>
  <button id="settingsBtn">⚙️</button>
  <div id="settingsPanel">
    <h3>⚙️ 설정</h3>
    <div class="srow"><span>자이로 민감도</span><input type="range" id="sensSlider" min="1" max="10" step="1" value="6"></div>
    <div class="srow"><span>음악 볼륨</span><input type="range" id="bgmSlider" min="0" max="1" step=".05" value=".7"></div>
    <div class="srow"><span>효과음 볼륨</span><input type="range" id="sfxSlider" min="0" max="1" step=".05" value=".8"></div>
    <div class="srow"><span>난이도</span>
      <span>
        <button class="db on" data-d="easy">쉬움</button>
        <button class="db" data-d="normal">보통</button>
        <button class="db" data-d="hard">어려움</button>
      </span>
    </div>
    <div class="srow"><span>자이로 재보정</span><button class="db" id="recalibBtn">재보정</button></div>
    <button id="settingsClose">닫기</button>
  </div>
</div>
<script>
(function(){
'use strict';

var wrap=document.getElementById('wrap');
function resize(){
  var sc=Math.min(window.innerWidth/360,window.innerHeight/640);
  wrap.style.transform='scale('+sc+')';
  wrap.style.left=Math.round((window.innerWidth-360*sc)/2)+'px';
  wrap.style.top=Math.round((window.innerHeight-640*sc)/2)+'px';
}
resize();
window.addEventListener('resize',resize);

var C=document.getElementById('c');
var ctx=C.getContext('2d');
var W=360,H=640;

var cfg={gyroSens:6,bgmVol:.70,sfxVol:.80,difficulty:'easy'};
try{var _s=localStorage.getItem('spg');if(_s)cfg=Object.assign(cfg,JSON.parse(_s));}catch(e){}
function saveCfg(){try{localStorage.setItem('spg',JSON.stringify(cfg));}catch(e){}}
function gyroMax(){return 62-(cfg.gyroSens-1)*5;}

// Audio
var actx=null;
function AC(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
var bgmTimer=null,bgmRunning=false,bgmIdx=0;
var MEL=[784,0,1047,784,880,0,1047,880,988,0,880,784,659,0,784,659,698,0,880,698,784,0,1047,784,880,659,784,0,523,659,784,0];
var BAS=[131,0,131,0,196,0,196,0,165,0,165,0,196,0,196,0,175,0,175,0,131,0,131,0,196,0,165,0,131,0,131,0];
var DRM=['K','-','H','-','S','-','H','-','K','-','H','-','S','-','H','-','K','-','H','-','S','-','H','-','K','H','K','H','S','-','H','-'];

function tone(f,type,vol,dur){try{var a=AC(),o=a.createOscillator(),g=a.createGain();o.type=type;o.connect(g);g.connect(a.destination);o.frequency.value=f;g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.start();o.stop(a.currentTime+dur+.01);}catch(e){}}
function noiseFx(ftype,freq,vol,dur){try{var a=AC(),n=Math.ceil(a.sampleRate*dur),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=buf;f.type=ftype;f.frequency.value=freq;s.connect(f);f.connect(g);g.connect(a.destination);g.gain.setValueAtTime(vol,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);s.start();}catch(e){}}
function kick(){noiseFx('lowpass',150,.5,.15);}
function snare(){noiseFx('bandpass',2000,.35,.1);}
function hihat(){noiseFx('highpass',7000,.15,.04);}
function beep(f,d,v){tone(f,'sine',v||.3,d||.1);}

function bgmTick(){
  var v=cfg.bgmVol;
  if(MEL[bgmIdx])tone(MEL[bgmIdx],'triangle',.08*v,.13);
  if(BAS[bgmIdx])tone(BAS[bgmIdx],'sine',.06*v,.13);
  var dr=DRM[bgmIdx];
  if(dr==='K')kick();else if(dr==='S')snare();else if(dr==='H')hihat();
  bgmIdx=(bgmIdx+1)%MEL.length;
}
function startBgm(){if(bgmRunning)return;bgmRunning=true;bgmIdx=0;bgmTimer=setInterval(bgmTick,150);}
function stopBgm(){clearInterval(bgmTimer);bgmRunning=false;}

// Gyro
var gyroOn=false,gyroVal=0,gyroBL=0;
function setupGyro(){window.addEventListener('deviceorientation',function(e){if(e.gamma!=null)gyroVal=e.gamma;});gyroOn=true;}
function calibGyro(){gyroBL=gyroVal;}
function gyroInput(){
  var raw=gyroVal-gyroBL,dead=10,mx=gyroMax();
  if(Math.abs(raw)<dead)return 0;
  return Math.max(-1,Math.min(1,(Math.abs(raw)-dead)/(mx-dead)*(raw>0?1:-1)));
}
async function reqGyro(){
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    try{if(await DeviceOrientationEvent.requestPermission()==='granted'){setupGyro();setTimeout(calibGyro,200);}}catch(e){}
  }else{setupGyro();setTimeout(calibGyro,200);}
}

var keys={};
window.addEventListener('keydown',function(e){keys[e.key]=true;if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();doJump();}});
window.addEventListener('keyup',function(e){keys[e.key]=false;});

// 3D constants
var HY=185,PY=510,RHW=115,ZDEPTH=480,NSTRIP=34;

// State
var gs='menu',dist,fish,lives,score,worldZ,spd;
var spx,spy,spvy,spJump,spJC,invT,inkT,magT,dblJ;
var rcX,rcTarget,rcTimer,objs,gaps,parts,nxtSpawn;
var bestDist=0;
try{bestDist=parseInt(localStorage.getItem('spgb')||'0');}catch(e){}

// Snow flakes (persist across states)
var snow=[];
for(var _i=0;_i<55;_i++)snow.push({x:Math.random()*W,y:Math.random()*H,r:.8+Math.random()*2.2,v:.6+Math.random()*1.4,wx:(Math.random()-.5)*.4});

function initGame(){
  dist=0;fish=0;lives=3;score=0;worldZ=0;
  spd=3.5+({easy:0,normal:.5,hard:1}[cfg.difficulty]||0);
  spx=0;spy=0;spvy=0;spJump=false;spJC=0;
  invT=0;inkT=0;magT=0;dblJ=false;
  rcX=W/2;rcTarget=W/2;rcTimer=0;
  objs=[];gaps=[];parts=[];nxtSpawn=140;
}

function proj(wz,rx,wy){
  wy=wy||0;
  var t=Math.max(0,Math.min(1,wz/ZDEPTH));
  var sy=PY-t*(PY-HY);
  var sx=W/2+(1-t)*((rcX-W/2)+rx*RHW);
  var sc=1-t*.82;
  return{x:sx,y:sy-wy*sc*1.4,s:sc};
}
function lerp(a,b,t){return a+(b-a)*t;}

function spawnSeg(){
  var oR={easy:.22,normal:.38,hard:.52}[cfg.difficulty]||.22;
  var gap={easy:190,normal:150,hard:110}[cfg.difficulty]||190;
  if(Math.random()>=oR){
    var fts=['o','o','o','b','b','g','d'];
    var n=2+Math.floor(Math.random()*4);
    var rxs=[-0.65,-0.35,0,0.35,0.65].sort(function(){return Math.random()-.5;}).slice(0,n);
    for(var i=0;i<n;i++)objs.push({k:'fish',ft:fts[Math.floor(Math.random()*fts.length)],wz:nxtSpawn+Math.random()*25,rx:rxs[i],wy:10,got:false});
    if(Math.random()<.1){var bts=['mag','inv','dbl','chest'];objs.push({k:'boost',bt:bts[Math.floor(Math.random()*bts.length)],wz:nxtSpawn+55,rx:(Math.random()-.5)*.75,wy:10,got:false});}
  }else{
    var ot=Math.random();
    if(ot<.32){
      var nc=1+Math.floor(Math.random()*2);
      for(var j=0;j<nc;j++){var rx2=(Math.random()-.5)*1.35;objs.push({k:'shadow',wz:nxtSpawn-55,rx:rx2});objs.push({k:'ice',wz:nxtSpawn,rx:rx2,wy:0,hit:false});}
    }else if(ot<.56){
      var gMin=worldZ+nxtSpawn-15,gMax=gMin+75+Math.random()*55;
      gaps.push({a:gMin,b:gMax,kill:false});
    }else if(ot<.78){
      objs.push({k:'octo',wz:nxtSpawn,rx:(Math.random()-.5)*.85,wy:0,hit:false});
    }else{
      objs.push({k:'door',wz:nxtSpawn,rx:(Math.random()<.5?-.4:.4),wy:0,hit:false});
    }
  }
  nxtSpawn+=gap+Math.random()*75;
}

function fcol(ft){
  if(ft==='o')return{b:'#e06600',f:'#ffcc44',s:'#c05000',p:1};
  if(ft==='b')return{b:'#1155ee',f:'#88aaff',s:'#0033aa',p:3};
  if(ft==='g')return{b:'#119933',f:'#66ee77',s:'#007722',p:5};
  return{b:'#66aaff',f:'#ddf4ff',s:'#3377cc',p:10};
}

// Cloud data
var clouds=[
  {x:40,y:38,r:22,ox:.008},
  {x:160,y:25,r:28,ox:.005},
  {x:290,y:42,r:20,ox:.007},
  {x:220,y:58,r:16,ox:.006}
];

function drawCloud(cx,cy,r){
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx-r*.65,cy+r*.2,r*.7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+r*.65,cy+r*.2,r*.7,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(cx+r*.3,cy-r*.3,r*.6,0,Math.PI*2);ctx.fill();
}

function drawSky(){
  // Sky gradient - bright daytime
  var g=ctx.createLinearGradient(0,0,0,HY);
  g.addColorStop(0,'#5bb8f5');
  g.addColorStop(.5,'#87ceeb');
  g.addColorStop(1,'#b8e4f7');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HY);

  // Sun
  var sunX=310,sunY=28;
  var sunG=ctx.createRadialGradient(sunX,sunY,0,sunX,sunY,30);
  sunG.addColorStop(0,'rgba(255,255,200,1)');
  sunG.addColorStop(.4,'rgba(255,230,80,.9)');
  sunG.addColorStop(1,'rgba(255,200,0,0)');
  ctx.fillStyle=sunG;ctx.beginPath();ctx.arc(sunX,sunY,30,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fffde0';ctx.beginPath();ctx.arc(sunX,sunY,14,0,Math.PI*2);ctx.fill();

  // Clouds
  var t=Date.now()*.001;
  for(var i=0;i<clouds.length;i++){
    var cl=clouds[i];
    drawCloud((cl.x+t*cl.ox*80)%400-20,cl.y,cl.r);
  }

  // Horizon glow
  var hg=ctx.createLinearGradient(0,HY-20,0,HY+8);
  hg.addColorStop(0,'rgba(255,255,255,0)');
  hg.addColorStop(1,'rgba(240,248,255,.85)');
  ctx.fillStyle=hg;ctx.fillRect(0,HY-20,W,28);
}

function drawRoad(){
  for(var i=0;i<NSTRIP;i++){
    var t0=i/NSTRIP,t1=(i+1)/NSTRIP;
    var y0=lerp(HY,PY+35,t0),y1=lerp(HY,PY+35,t1);
    var hw0=RHW*t0+4,hw1=RHW*t1+4;
    var cx0=W/2+(rcX-W/2)*(1-t0),cx1=W/2+(rcX-W/2)*(1-t1);
    var wzA=worldZ+(1-t0)*ZDEPTH,isGap=false;
    for(var gi=0;gi<gaps.length;gi++){if(wzA>=gaps[gi].a&&wzA<=gaps[gi].b){isGap=true;break;}}

    // Ocean on sides - bright blue
    var seaL=lerp(.55,.92,t0);
    ctx.fillStyle='hsl(205,'+Math.round(55+t0*20)+'%,'+Math.round(seaL*100)+'%)';
    ctx.fillStyle='#4aa8d8';
    // Left sea
    ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(cx0-hw0,y0);ctx.lineTo(cx1-hw1,y1);ctx.lineTo(0,y1);ctx.closePath();ctx.fill();
    // Right sea
    ctx.beginPath();ctx.moveTo(W,y0);ctx.lineTo(cx0+hw0,y0);ctx.lineTo(cx1+hw1,y1);ctx.lineTo(W,y1);ctx.closePath();ctx.fill();

    // Road / gap
    if(isGap){
      // Gap - dark water
      ctx.fillStyle='#1a6a9a';
      ctx.beginPath();ctx.moveTo(cx0-hw0,y0);ctx.lineTo(cx0+hw0,y0);ctx.lineTo(cx1+hw1,y1);ctx.lineTo(cx1-hw1,y1);ctx.closePath();ctx.fill();
    }else{
      // Ice road - bright white/light blue alternating strips
      var stripe=(i+Math.floor(worldZ/18))%2;
      ctx.fillStyle=stripe?'#e8f5ff':'#f5fbff';
      ctx.beginPath();ctx.moveTo(cx0-hw0,y0);ctx.lineTo(cx0+hw0,y0);ctx.lineTo(cx1+hw1,y1);ctx.lineTo(cx1-hw1,y1);ctx.closePath();ctx.fill();

      // Snow banks on sides
      if(i>4){
        var sbH=hw0*.22;
        ctx.fillStyle='#fff';
        ctx.beginPath();ctx.moveTo(cx0-hw0,y0);ctx.lineTo(cx0-hw0+3,y0-sbH);ctx.lineTo(cx1-hw1+3,y1-sbH*.5);ctx.lineTo(cx1-hw1,y1);ctx.closePath();ctx.fill();
        ctx.beginPath();ctx.moveTo(cx0+hw0,y0);ctx.lineTo(cx0+hw0-3,y0-sbH);ctx.lineTo(cx1+hw1-3,y1-sbH*.5);ctx.lineTo(cx1+hw1,y1);ctx.closePath();ctx.fill();
      }

      // Center line
      if(i>2&&i%3===0){
        ctx.strokeStyle='rgba(160,200,230,.5)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(cx0,y0);ctx.lineTo(cx1,y1);ctx.stroke();
      }
    }

    // Sea highlights
    if(!isGap&&i>0&&i%5===0){
      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(cx0-hw0-8,y0);ctx.lineTo(cx0-hw0-14,y0+2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(cx0+hw0+8,y0);ctx.lineTo(cx0+hw0+14,y0+2);ctx.stroke();
    }
  }
}

function drawObjects(){
  var sorted=objs.slice().sort(function(a,b){return b.wz-a.wz;});
  for(var i=0;i<sorted.length;i++){
    var o=sorted[i];if(o.got||o.hit)continue;
    var p=proj(o.wz,o.rx||0,o.wy||0);
    if(p.y<HY-5||p.y>PY+25)continue;
    var sx=p.x,sy=p.y,sc=p.s;
    ctx.save();
    if(o.k==='shadow'){
      ctx.globalAlpha=.3;ctx.fillStyle='rgba(0,0,80,.5)';
      ctx.beginPath();ctx.ellipse?ctx.ellipse(sx,sy,20*sc,5*sc,0,0,Math.PI*2):
        (function(cx,cy,rx,ry){ctx.save();ctx.translate(cx,cy);ctx.scale(rx/ry,1);ctx.beginPath();ctx.arc(0,0,ry,0,Math.PI*2);ctx.restore();ctx.fill();})(sx,sy,20*sc,5*sc);
      ctx.fill();
    }else if(o.k==='ice'){
      var iw=14*sc,ih=30*sc;
      // Icicle with nice gradient
      var ig=ctx.createLinearGradient(sx-iw,sy-ih,sx+iw,sy);
      ig.addColorStop(0,'rgba(200,235,255,.95)');
      ig.addColorStop(.4,'rgba(160,210,245,.9)');
      ig.addColorStop(1,'rgba(100,170,220,.1)');
      ctx.fillStyle=ig;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-iw*.55,sy-ih*.5);ctx.lineTo(sx,sy-ih);ctx.lineTo(sx+iw*.55,sy-ih*.5);ctx.closePath();ctx.fill();
      // Highlight
      ctx.fillStyle='rgba(255,255,255,.7)';
      ctx.beginPath();ctx.moveTo(sx-iw*.1,sy-ih*.2);ctx.lineTo(sx-iw*.3,sy-ih*.65);ctx.lineTo(sx,sy-ih);ctx.closePath();ctx.fill();
    }else if(o.k==='octo'){
      var or=15*sc;
      // Body
      var og=ctx.createRadialGradient(sx-or*.3,sy-or-or*.3,0,sx,sy-or,or);
      og.addColorStop(0,'#9933cc');og.addColorStop(1,'#440088');
      ctx.fillStyle=og;ctx.beginPath();ctx.arc(sx,sy-or,or,0,Math.PI*2);ctx.fill();
      // Tentacles
      for(var t=0;t<6;t++){
        var ang=Math.PI+(t/5)*Math.PI;
        var tw=Date.now()*.003+t;
        ctx.strokeStyle='#7722bb';ctx.lineWidth=3*sc;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(sx,sy);
        ctx.quadraticCurveTo(sx+Math.cos(ang+.3)*or*1.2+Math.sin(tw)*(3*sc),sy+Math.sin(ang)*or*.8+Math.cos(tw)*(3*sc),sx+Math.cos(ang)*or*1.5,sy+Math.sin(ang)*or);
        ctx.stroke();
      }
      // Eyes
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx-5*sc,sy-or-2*sc,3.5*sc,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+5*sc,sy-or-2*sc,3.5*sc,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#220044';ctx.beginPath();ctx.arc(sx-4*sc,sy-or-2*sc,2*sc,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+6*sc,sy-or-2*sc,2*sc,0,Math.PI*2);ctx.fill();
    }else if(o.k==='door'){
      var dw=28*sc,dh=52*sc;
      // Wood door
      var dg=ctx.createLinearGradient(sx-dw,0,sx-dw+dw*.5,0);
      dg.addColorStop(0,'#5c3010');dg.addColorStop(.5,'#8b5520');dg.addColorStop(1,'#5c3010');
      ctx.fillStyle=dg;ctx.fillRect(sx-dw,sy-dh,dw,dh);
      var dg2=ctx.createLinearGradient(sx,0,sx+dw,0);
      dg2.addColorStop(0,'#5c3010');dg2.addColorStop(.5,'#8b5520');dg2.addColorStop(1,'#5c3010');
      ctx.fillStyle=dg2;ctx.fillRect(sx,sy-dh,dw,dh);
      // Door gap
      ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(sx-2*sc,sy-dh,4*sc,dh);
      // Wood grain
      ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=1;
      for(var dl=1;dl<4;dl++){ctx.beginPath();ctx.moveTo(sx-dw,sy-dh+dh*dl/4);ctx.lineTo(sx,sy-dh+dh*dl/4);ctx.stroke();}
      for(var dl=1;dl<4;dl++){ctx.beginPath();ctx.moveTo(sx,sy-dh+dh*dl/4);ctx.lineTo(sx+dw,sy-dh+dh*dl/4);ctx.stroke();}
    }else if(o.k==='fish'){
      var fc=fcol(o.ft),fr=9*sc;
      if(o.ft==='d'){
        // Diamond collectible
        var ds=13*sc;
        var diam=ctx.createLinearGradient(sx,sy-ds,sx,sy+ds*.5);
        diam.addColorStop(0,'#aaddff');diam.addColorStop(.4,'#66bbff');diam.addColorStop(1,'#3399ff');
        ctx.fillStyle=diam;
        ctx.beginPath();ctx.moveTo(sx,sy-ds);ctx.lineTo(sx+ds*.6,sy);ctx.lineTo(sx,sy+ds*.55);ctx.lineTo(sx-ds*.6,sy);ctx.closePath();ctx.fill();
        // Shine
        ctx.fillStyle='rgba(255,255,255,.7)';
        ctx.beginPath();ctx.moveTo(sx-ds*.1,sy-ds*.6);ctx.lineTo(sx+ds*.2,sy-ds*.2);ctx.lineTo(sx,sy-ds*.1);ctx.closePath();ctx.fill();
      }else{
        // Fish body
        ctx.fillStyle=fc.b;
        ctx.beginPath();ctx.moveTo(sx+fr*1.5,sy);ctx.quadraticCurveTo(sx+fr*.3,sy-fr*.9,sx-fr*1.2,sy);ctx.quadraticCurveTo(sx+fr*.3,sy+fr*.9,sx+fr*1.5,sy);ctx.fill();
        // Belly stripe
        ctx.fillStyle=fc.f;
        ctx.beginPath();ctx.moveTo(sx+fr,sy);ctx.quadraticCurveTo(sx+fr*.2,sy-fr*.4,sx-fr*.4,sy);ctx.quadraticCurveTo(sx+fr*.2,sy+fr*.4,sx+fr,sy);ctx.fill();
        // Side stripe for clownfish look
        if(o.ft==='o'){
          ctx.fillStyle='rgba(255,255,255,.75)';
          ctx.beginPath();ctx.moveTo(sx,sy-fr*.7);ctx.quadraticCurveTo(sx-fr*.3,sy,sx,sy+fr*.7);ctx.quadraticCurveTo(sx-fr*.6,sy,sx,sy-fr*.7);ctx.fill();
        }
        // Tail
        ctx.fillStyle=fc.b;
        ctx.beginPath();ctx.moveTo(sx-fr*1.2,sy);ctx.lineTo(sx-fr*2.2,sy-fr*.7);ctx.lineTo(sx-fr*2.2,sy+fr*.7);ctx.closePath();ctx.fill();
        // Eye
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx+fr*.6,sy-fr*.25,fr*.3,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#111';ctx.beginPath();ctx.arc(sx+fr*.68,sy-fr*.25,fr*.17,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx+fr*.74,sy-fr*.32,fr*.08,0,Math.PI*2);ctx.fill();
        // Shine
        ctx.fillStyle='rgba(255,255,255,.35)';
        ctx.beginPath();ctx.moveTo(sx+fr*.4,sy-fr*.6);ctx.quadraticCurveTo(sx+fr*.7,sy-fr*.4,sx+fr*.2,sy-fr*.15);ctx.quadraticCurveTo(sx+fr*.1,sy-fr*.5,sx+fr*.4,sy-fr*.6);ctx.fill();
      }
    }else if(o.k==='boost'){
      var br=12*sc;
      var bcols={mag:'#ff4444',inv:'#ffee00',dbl:'#00dddd',chest:'#ffcc00'};
      var blbls={mag:'🧲',inv:'⭐',dbl:'🔼',chest:'💎'};
      // Glow
      var bglow=ctx.createRadialGradient(sx,sy,0,sx,sy,br*1.8);
      bglow.addColorStop(0,bcols[o.bt]||'#ff88ff');bglow.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=bglow;ctx.beginPath();ctx.arc(sx,sy,br*1.8,0,Math.PI*2);ctx.fill();
      // Main circle
      var bcg=ctx.createRadialGradient(sx-br*.3,sy-br*.3,0,sx,sy,br);
      bcg.addColorStop(0,'rgba(255,255,255,.9)');bcg.addColorStop(.4,bcols[o.bt]||'#ff88ff');bcg.addColorStop(1,bcols[o.bt]||'#ff88ff');
      ctx.fillStyle=bcg;ctx.beginPath();ctx.arc(sx,sy,br,0,Math.PI*2);ctx.fill();
      ctx.font=Math.round(Math.max(10,14*sc))+'px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(blbls[o.bt]||'?',sx,sy+1);
    }
    ctx.restore();
  }
}

function drawPenguin(){
  var px=W/2+spx*RHW,py=PY-spy,bh=46;
  ctx.save();
  if(invT>0)ctx.globalAlpha=.45+.5*Math.sin(Date.now()*.02);

  // Ground shadow
  var sha=ctx.globalAlpha||1;
  ctx.globalAlpha=sha*.4;
  var sg=ctx.createRadialGradient(px,PY+2,0,px,PY+2,20);
  sg.addColorStop(0,'rgba(0,50,120,.6)');sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(px,PY+2,20,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=invT>0?(.45+.5*Math.sin(Date.now()*.02)):1;

  // Feet animation
  var step=Math.sin(Date.now()*.012)*4;
  ctx.fillStyle='#ff7700';
  ctx.beginPath();ctx.moveTo(px-3+step,py+4);ctx.lineTo(px-11+step,py+10);ctx.lineTo(px+2+step,py+10);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(px+3-step,py+4);ctx.lineTo(px+11-step,py+10);ctx.lineTo(px-2-step,py+10);ctx.closePath();ctx.fill();

  // Body - dark blue penguin (matches original)
  var bg=ctx.createRadialGradient(px-5,py-bh*.3,0,px,py-bh*.4,bh*.7);
  bg.addColorStop(0,'#2244aa');bg.addColorStop(.6,'#0d1f5c');bg.addColorStop(1,'#060e30');
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.moveTo(px-14,py+2);ctx.quadraticCurveTo(px-17,py-bh*.45,px,py-bh);ctx.quadraticCurveTo(px+17,py-bh*.45,px+14,py+2);ctx.closePath();ctx.fill();

  // Belly
  var wg=ctx.createRadialGradient(px,py-bh*.25,0,px,py-bh*.3,bh*.4);
  wg.addColorStop(0,'#fffce8');wg.addColorStop(.7,'#eef8dd');wg.addColorStop(1,'rgba(240,250,220,0)');
  ctx.fillStyle=wg;
  ctx.beginPath();ctx.moveTo(px-7,py+1);ctx.quadraticCurveTo(px-9,py-bh*.35,px,py-bh*.6);ctx.quadraticCurveTo(px+9,py-bh*.35,px+7,py+1);ctx.closePath();ctx.fill();

  // Head
  var hg2=ctx.createRadialGradient(px-4,py-bh-8,0,px,py-bh-4,14);
  hg2.addColorStop(0,'#1a3399');hg2.addColorStop(1,'#060e30');
  ctx.fillStyle=hg2;ctx.beginPath();ctx.arc(px,py-bh-4,13,0,Math.PI*2);ctx.fill();

  // Eyes
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-5,py-bh-7,4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(px+5,py-bh-7,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0a0a22';ctx.beginPath();ctx.arc(px-4,py-bh-7,2.3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(px+6,py-bh-7,2.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-3.2,py-bh-8,1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(px+6.8,py-bh-8,1,0,Math.PI*2);ctx.fill();

  // Beak
  ctx.fillStyle='#ff8800';
  ctx.beginPath();ctx.moveTo(px,py-bh-5);ctx.lineTo(px+11,py-bh-8);ctx.lineTo(px+10,py-bh-2);ctx.closePath();ctx.fill();
  ctx.fillStyle='#cc5500';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(px,py-bh-5);ctx.lineTo(px+11,py-bh-5.5);ctx.stroke();

  // Flippers with animation
  var fa=Math.sin(Date.now()*.009)*.35;
  var fg=ctx.createLinearGradient(0,0,0,1);
  ctx.fillStyle='#0d1f5c';
  ctx.save();ctx.translate(px-14,py-bh*.48);ctx.rotate(-0.5+fa);
  ctx.beginPath();ctx.moveTo(0,-16);ctx.quadraticCurveTo(-9,0,0,16);ctx.quadraticCurveTo(4,4,7,-16);ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(px+14,py-bh*.48);ctx.rotate(0.5-fa);
  ctx.beginPath();ctx.moveTo(0,-16);ctx.quadraticCurveTo(9,0,0,16);ctx.quadraticCurveTo(-4,4,-7,-16);ctx.closePath();ctx.fill();
  ctx.restore();

  // Body shine
  ctx.fillStyle='rgba(100,150,255,.18)';
  ctx.beginPath();ctx.moveTo(px-8,py-bh*.1);ctx.quadraticCurveTo(px-13,py-bh*.55,px-4,py-bh*.88);ctx.quadraticCurveTo(px-12,py-bh*.5,px-5,py-bh*.05);ctx.fill();

  ctx.restore();
}

function drawSnow(){
  var t=Date.now()*.001;
  for(var i=0;i<snow.length;i++){
    var s=snow[i];
    s.y+=s.v;s.x+=s.wx+Math.sin(t*s.v+i)*.3;
    if(s.y>H){s.y=-5;s.x=Math.random()*W;}
    if(s.x>W+5)s.x=-5;if(s.x<-5)s.x=W+5;
    ctx.globalAlpha=.55+Math.sin(t*2+i)*.2;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawParticles(){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];ctx.save();ctx.globalAlpha=p.l;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l,0,Math.PI*2);ctx.fill();ctx.restore();
    p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.l-=.03;if(p.l<=0)parts.splice(i,1);
  }
}
function burst(x,y,col,n){n=n||8;for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=2+Math.random()*4;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,r:3+Math.random()*5,c:col,l:1});}}

function updateHUD(){
  document.getElementById('livesBox').textContent='❤️'.repeat(Math.max(0,lives));
  document.getElementById('distBox').textContent=Math.floor(dist)+'m';
  document.getElementById('bestBox').textContent='Best: '+Math.floor(bestDist)+'m';
  document.getElementById('fishBox').textContent='🐟 '+fish;
  var bt='';if(magT>0)bt+='🧲 ';if(invT>0)bt+='⭐ ';if(dblJ)bt+='🔼 ';
  document.getElementById('boostBox').textContent=bt;
}

function collide(){
  for(var i=0;i<objs.length;i++){
    var o=objs[i];if(o.got||o.hit)continue;if(o.wz>20||o.wz<-10)continue;
    var dx=Math.abs(spx-o.rx);
    if(o.k==='fish'&&dx<.19){o.got=true;var fc=fcol(o.ft);fish+=fc.p;score+=fc.p;beep(880,.07,cfg.sfxVol*.3);burst(W/2+spx*RHW,PY-spy,fc.b);}
    else if(o.k==='boost'&&dx<.21){o.got=true;applyBoost(o.bt);beep(1047,.12,cfg.sfxVol*.28);burst(W/2+spx*RHW,PY-spy,'#ffee88',12);}
    else if(o.k==='ice'&&dx<.15&&spy<18){o.hit=true;hit();}
    else if(o.k==='octo'&&dx<.22){o.hit=true;inkT=200;document.getElementById('inkScreen').style.background='rgba(15,0,30,.85)';hit();}
    else if(o.k==='door'&&dx<.21&&spy<12){o.hit=true;hit();}
    if(magT>0&&o.k==='fish'&&!o.got&&o.wz<85)o.rx+=(spx-o.rx)*.09;
  }
  for(var g=0;g<gaps.length;g++){
    var gz=gaps[g];
    if(worldZ>=gz.a&&worldZ<=gz.b&&spy<10){if(!gz.kill){gz.kill=true;hit();}}else gz.kill=false;
  }
}
function applyBoost(bt){
  if(bt==='mag')magT=320;else if(bt==='inv')invT=320;else if(bt==='dbl')dblJ=true;
  else{fish+=25;score+=25;beep(1320,.18,cfg.sfxVol*.4);}
}
function hit(){
  if(invT>0)return;lives--;beep(200,.3,cfg.sfxVol*.5);invT=130;
  if(lives<=0){lives=0;setTimeout(endGame,350);}
}
function doJump(){
  if(gs!=='play')return;
  if(spy===0&&!spJump){spvy=14.5;spJump=true;spJC=1;beep(523,.09,cfg.sfxVol*.32);}
  else if(spJC<2&&dblJ){spvy=12;spJC=2;dblJ=false;beep(659,.09,cfg.sfxVol*.32);burst(W/2+spx*RHW,PY-spy,'#44ffff',6);}
}

function update(){
  if(gs!=='play')return;
  spd=Math.min(spd+.00045,13);worldZ+=spd;dist=worldZ/20;
  rcTimer--;if(rcTimer<=0){rcTarget=W/2+(Math.random()-.5)*170;rcTimer=110+Math.random()*160;}
  rcX+=(rcTarget-rcX)*.013;
  var tx=0;
  if(gyroOn)tx=gyroInput();
  else if(keys['ArrowLeft']||keys['a'])tx=-1;
  else if(keys['ArrowRight']||keys['d'])tx=1;
  spx+=(tx-spx)*.13;spx=Math.max(-1,Math.min(1,spx));
  if(spJump||spy>0){spvy-=.72;spy+=spvy;if(spy<=0){spy=0;spvy=0;spJump=false;spJC=0;}}
  if(invT>0)invT--;if(magT>0)magT--;
  if(inkT>0){inkT--;if(inkT===0)document.getElementById('inkScreen').style.background='rgba(15,0,30,0)';}
  for(var i=0;i<objs.length;i++)objs[i].wz-=spd;
  for(var i=objs.length-1;i>=0;i--){if(objs[i].wz<-35)objs.splice(i,1);}
  for(var i=gaps.length-1;i>=0;i--){if(worldZ>gaps[i].b+220)gaps.splice(i,1);}
  while(nxtSpawn-worldZ<ZDEPTH*1.05)spawnSeg();
  collide();updateHUD();
}
function render(){
  ctx.clearRect(0,0,W,H);
  drawSky();drawRoad();drawObjects();drawPenguin();drawParticles();drawSnow();
}
function loop(){update();render();requestAnimationFrame(loop);}

function startGame(){
  initGame();gs='play';
  document.getElementById('overlay').style.display='none';
  document.getElementById('goPanel').style.display='none';
  document.getElementById('settingsBtn').style.display='block';
  document.getElementById('inkScreen').style.background='rgba(15,0,30,0)';
  startBgm();
}
function endGame(){
  gs='over';if(dist>bestDist){bestDist=dist;try{localStorage.setItem('spgb',Math.floor(bestDist));}catch(e){}}
  stopBgm();
  document.getElementById('goDist').textContent='거리: '+Math.floor(dist)+'m';
  document.getElementById('goFish').textContent='물고기: '+fish+'점';
  document.getElementById('goBest').textContent='최고기록: '+Math.floor(bestDist)+'m';
  document.getElementById('goPanel').style.display='flex';
}

C.addEventListener('touchstart',function(e){e.preventDefault();doJump();},{passive:false});
C.addEventListener('mousedown',doJump);
document.getElementById('startBtn').addEventListener('click',function(){
  try{AC().resume();}catch(e){}
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent))reqGyro().then(startGame);
  else{if(!gyroOn){setupGyro();setTimeout(calibGyro,300);}startGame();}
});
document.getElementById('restartBtn').addEventListener('click',function(){
  if(!gyroOn&&!/iPhone|iPad|iPod/i.test(navigator.userAgent)){setupGyro();setTimeout(calibGyro,300);}
  startGame();
});
document.getElementById('gyroBtn').addEventListener('click',reqGyro);
if(/iPhone|iPad|iPod/i.test(navigator.userAgent))document.getElementById('gyroBtn').style.display='inline-block';

document.getElementById('sensSlider').value=cfg.gyroSens;
document.getElementById('bgmSlider').value=cfg.bgmVol;
document.getElementById('sfxSlider').value=cfg.sfxVol;
document.querySelectorAll('.db[data-d]').forEach(function(b){
  b.classList.toggle('on',b.dataset.d===cfg.difficulty);
  b.addEventListener('click',function(){cfg.difficulty=b.dataset.d;document.querySelectorAll('.db[data-d]').forEach(function(x){x.classList.toggle('on',x===b);});saveCfg();});
});
document.getElementById('sensSlider').addEventListener('input',function(e){cfg.gyroSens=+e.target.value;saveCfg();});
document.getElementById('bgmSlider').addEventListener('input',function(e){cfg.bgmVol=+e.target.value;saveCfg();});
document.getElementById('sfxSlider').addEventListener('input',function(e){cfg.sfxVol=+e.target.value;saveCfg();});
document.getElementById('settingsBtn').addEventListener('click',function(){document.getElementById('settingsPanel').style.display='block';});
document.getElementById('settingsClose').addEventListener('click',function(){document.getElementById('settingsPanel').style.display='none';});
document.getElementById('recalibBtn').addEventListener('click',calibGyro);

initGame();
loop();
})();
</script>
</body>
