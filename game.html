<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>슈퍼펭귄</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a1628;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #gameWrapper {
    position: relative;
    width: 100%;
    max-width: 800px;
  }
  canvas {
    display: block;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(100, 200, 255, 0.3);
    cursor: pointer;
  }
  #ui {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }
  #score {
    position: absolute;
    top: 16px; right: 20px;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #best {
    position: absolute;
    top: 44px; right: 20px;
    color: #aed6f1;
    font-size: 14px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  #lives {
    position: absolute;
    top: 16px; left: 20px;
    font-size: 22px;
    letter-spacing: 4px;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 22, 40, 0.75);
    border-radius: 12px;
    pointer-events: all;
    gap: 12px;
  }
  #overlay h1 {
    font-size: 42px;
    color: #fff;
    text-shadow: 0 0 20px #64c8ff;
  }
  #overlay .sub {
    font-size: 16px;
    color: #aed6f1;
  }
  #overlay .hint {
    font-size: 13px;
    color: #7fb3d3;
    margin-top: 4px;
  }
  #startBtn {
    margin-top: 8px;
    padding: 14px 40px;
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, #1e90ff, #0055cc);
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(30,144,255,0.5);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  #startBtn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(30,144,255,0.7); }
  #startBtn:active { transform: scale(0.97); }
  #gameOverTitle { color: #ff6b6b; text-shadow: 0 0 20px #ff4444; }
  #finalScore { font-size: 18px; color: #fff; }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="score">점수: 0</div>
    <div id="best">최고: 0</div>
    <div id="lives">🐧🐧🐧</div>
    <div id="overlay">
      <h1>🐧 슈퍼펭귄</h1>
      <div class="sub">광고 없는 깨끗한 게임</div>
      <div class="hint">스페이스 / 클릭 / 탭 → 점프 &nbsp;|&nbsp; 더블점프 가능!</div>
      <button id="startBtn" onclick="startGame()">게임 시작</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 800, H = 300;
canvas.width = W; canvas.height = H;

const GROUND = H - 60;
const GRAVITY = 0.55;
const JUMP_V = -13;

let state = 'idle'; // idle | playing | dead
let score, best = 0, lives, frame, speed, spawnTimer, bgOffset, cloudOffset;
let penguin, obstacles, fishes, particles, clouds;

function initGame() {
  score = 0;
  lives = 3;
  frame = 0;
  speed = 4;
  spawnTimer = 60;
  bgOffset = 0;
  cloudOffset = 0;

  penguin = {
    x: 100, y: GROUND, w: 44, h: 52,
    vy: 0, onGround: true, jumps: 0,
    frame: 0, frameTimer: 0,
    invincible: 0, slideTimer: 0
  };

  obstacles = [];
  fishes = [];
  particles = [];
  clouds = [
    { x: 200, y: 40, s: 1 },
    { x: 500, y: 25, s: 0.8 },
    { x: 720, y: 55, s: 1.2 }
  ];

  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = '점수: ' + score;
  document.getElementById('best').textContent = '최고: ' + best;
  const h = ['🐧','🐧','🐧'];
  for (let i = lives; i < 3; i++) h[i] = '🩶';
  document.getElementById('lives').textContent = h.join('');
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  initGame();
  state = 'playing';
}

function jump() {
  if (state === 'idle') { startGame(); return; }
  if (state === 'dead') { startGame(); return; }
  if (penguin.jumps < 2) {
    penguin.vy = penguin.jumps === 0 ? JUMP_V : JUMP_V * 0.85;
    penguin.onGround = false;
    penguin.jumps++;
    spawnParticles(penguin.x + 22, penguin.y + 52, '#aef', 6);
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
canvas.addEventListener('click', jump);
canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });

// ── spawn helpers ──────────────────────────────────────────
function spawnObstacle() {
  const r = Math.random();
  if (r < 0.5) {
    // iceberg on ground
    const h = 30 + Math.random() * 35;
    obstacles.push({ x: W + 20, y: GROUND + 52 - h, w: 30, h, type: 'berg' });
  } else if (r < 0.8) {
    // snowball rolling
    obstacles.push({ x: W + 20, y: GROUND + 30, w: 28, h: 28, type: 'ball', angle: 0 });
  } else {
    // flying seagull
    const fy = 120 + Math.random() * 80;
    obstacles.push({ x: W + 20, y: fy, w: 38, h: 22, type: 'bird', flap: 0 });
  }
}

function spawnFish() {
  const y = GROUND - 20 - Math.random() * 80;
  fishes.push({ x: W + 20, y, w: 26, h: 18, bob: Math.random() * Math.PI * 2 });
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: -Math.random() * 4 - 1,
      life: 1,
      color
    });
  }
}

// ── collision ──────────────────────────────────────────────
function rectsOverlap(a, b, margin = 8) {
  return a.x + margin < b.x + b.w - margin &&
         a.x + a.w - margin > b.x + margin &&
         a.y + margin < b.y + b.h - margin &&
         a.y + a.h - margin > b.y + margin;
}

// ── draw helpers ───────────────────────────────────────────
function drawBackground() {
  // sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0a1a3a');
  sky.addColorStop(1, '#163d6e');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // aurora strips
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#00ffcc';
  ctx.beginPath();
  ctx.ellipse(200 + Math.sin(frame * 0.008) * 30, 60, 220, 25, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#aa44ff';
  ctx.beginPath();
  ctx.ellipse(580 + Math.sin(frame * 0.01) * 20, 80, 180, 18, -0.1, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // stars
  ctx.save();
  ctx.fillStyle = '#fff';
  const starSeeds = [13,37,71,99,157,213,277,333];
  for (const s of starSeeds) {
    const sx = ((s * 97 + bgOffset * 0.1) % W);
    const sy = (s * 43) % (GROUND - 80);
    const alpha = 0.4 + Math.sin(frame * 0.05 + s) * 0.3;
    ctx.globalAlpha = alpha;
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.restore();

  // clouds
  for (const cl of clouds) {
    cl.x -= speed * 0.3;
    if (cl.x < -120) cl.x = W + 60;
    drawCloud(cl.x, cl.y, cl.s);
  }

  // ground ice
  ctx.fillStyle = '#1a4a7a';
  ctx.fillRect(0, GROUND + 52, W, H - GROUND - 52);

  // ice surface shine
  const iceX = (-bgOffset * 0.5) % 80;
  ctx.save();
  ctx.globalAlpha = 0.25;
  ctx.fillStyle = '#ffffff';
  for (let x = iceX; x < W; x += 80) {
    ctx.fillRect(x, GROUND + 52, 40, 4);
  }
  ctx.restore();

  // ground line
  ctx.strokeStyle = '#3af';
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.moveTo(0, GROUND + 52);
  ctx.lineTo(W, GROUND + 52);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawCloud(x, y, s) {
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = '#aef';
  ctx.beginPath();
  ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
  ctx.arc(x + 20 * s, y - 8 * s, 16 * s, 0, Math.PI * 2);
  ctx.arc(x + 38 * s, y, 20 * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPenguin(p) {
  ctx.save();
  if (p.invincible > 0 && Math.floor(frame / 4) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  const px = p.x, py = p.y;
  const bobY = p.onGround ? Math.sin(frame * 0.2) * 1.5 : 0;

  // shadow
  ctx.save();
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(px + 22, GROUND + 56, 18, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // body
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.ellipse(px + 22, py + 32 + bobY, 17, 22, 0, 0, Math.PI * 2);
  ctx.fill();

  // belly
  ctx.fillStyle = '#e8f4f8';
  ctx.beginPath();
  ctx.ellipse(px + 22, py + 34 + bobY, 10, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  // head
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(px + 22, py + 10 + bobY, 14, 0, Math.PI * 2);
  ctx.fill();

  // eye white
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(px + 28, py + 7 + bobY, 5, 0, Math.PI * 2);
  ctx.fill();
  // pupil
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(px + 30, py + 8 + bobY, 3, 0, Math.PI * 2);
  ctx.fill();

  // beak
  ctx.fillStyle = '#f4a300';
  ctx.beginPath();
  ctx.moveTo(px + 34, py + 13 + bobY);
  ctx.lineTo(px + 42, py + 15 + bobY);
  ctx.lineTo(px + 34, py + 17 + bobY);
  ctx.closePath();
  ctx.fill();

  // wings (animated)
  const wingAngle = p.onGround ? Math.sin(frame * 0.15) * 0.4 : -0.7;
  ctx.fillStyle = '#1a1a2e';
  ctx.save();
  ctx.translate(px + 8, py + 28 + bobY);
  ctx.rotate(-wingAngle);
  ctx.fillRect(-4, -5, 8, 18);
  ctx.restore();
  ctx.save();
  ctx.translate(px + 36, py + 28 + bobY);
  ctx.rotate(wingAngle);
  ctx.fillRect(-4, -5, 8, 18);
  ctx.restore();

  // feet
  ctx.fillStyle = '#f4a300';
  if (p.onGround) {
    const fStep = Math.sin(frame * 0.25) * 5;
    ctx.fillRect(px + 12, py + 50 + bobY, 10, 5);
    ctx.fillRect(px + 24, py + 50 + bobY + fStep, 10, 5);
  } else {
    ctx.fillRect(px + 12, py + 50, 10, 5);
    ctx.fillRect(px + 26, py + 50, 10, 5);
  }

  // double-jump sparkle
  if (!p.onGround && p.jumps === 2) {
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#64c8ff';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const a = (frame * 0.2 + i * Math.PI / 2);
      ctx.beginPath();
      ctx.arc(px + 22, py + 30 + bobY, 20, a, a + 0.5);
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore();
}

function drawIceberg(o) {
  ctx.fillStyle = '#7ec8e3';
  ctx.beginPath();
  ctx.moveTo(o.x, o.y + o.h);
  ctx.lineTo(o.x + o.w * 0.3, o.y);
  ctx.lineTo(o.x + o.w * 0.7, o.y + o.h * 0.2);
  ctx.lineTo(o.x + o.w, o.y + o.h);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.moveTo(o.x + o.w * 0.3, o.y);
  ctx.lineTo(o.x + o.w * 0.5, o.y + o.h * 0.3);
  ctx.lineTo(o.x + o.w * 0.25, o.y + o.h * 0.5);
  ctx.closePath();
  ctx.fill();
}

function drawSnowball(o) {
  ctx.save();
  ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
  ctx.rotate(o.angle);
  ctx.fillStyle = '#d0eeff';
  ctx.beginPath();
  ctx.arc(0, 0, o.w / 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#aaddff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-o.w / 2, 0);
  ctx.lineTo(o.w / 2, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, -o.h / 2);
  ctx.lineTo(0, o.h / 2);
  ctx.stroke();
  ctx.restore();
}

function drawBird(o) {
  o.flap += 0.2;
  const flapY = Math.sin(o.flap) * 5;
  ctx.save();
  ctx.translate(o.x + o.w / 2, o.y + flapY);
  // body
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath();
  ctx.ellipse(0, 0, 16, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  // wings
  ctx.fillStyle = '#ccc';
  const wa = Math.sin(o.flap) * 0.6;
  ctx.save(); ctx.rotate(-wa);
  ctx.beginPath(); ctx.ellipse(-14, -4, 12, 5, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.rotate(wa);
  ctx.beginPath(); ctx.ellipse(14, -4, 12, 5, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // beak
  ctx.fillStyle = '#f4a300';
  ctx.beginPath();
  ctx.moveTo(16, 0); ctx.lineTo(24, -2); ctx.lineTo(16, 4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawFish(f) {
  const by = Math.sin(frame * 0.08 + f.bob) * 4;
  ctx.save();
  ctx.translate(f.x + f.w / 2, f.y + by);
  // tail
  ctx.fillStyle = '#ffd700';
  ctx.beginPath();
  ctx.moveTo(-f.w / 2 - 4, 0);
  ctx.lineTo(-f.w / 2 + 2, -7);
  ctx.lineTo(-f.w / 2 + 2, 7);
  ctx.closePath();
  ctx.fill();
  // body
  ctx.fillStyle = '#ffec00';
  ctx.beginPath();
  ctx.ellipse(0, 0, f.w / 2, f.h / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(3, -3, 4, 2, -0.4, 0, Math.PI * 2);
  ctx.fill();
  // eye
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(f.w / 2 - 4, -2, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    ctx.restore();
  }
}

function drawHUD() {
  // score flash on pickup
  if (frame % 60 < 10 && score > 0) {
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

// ── main loop ──────────────────────────────────────────────
function update() {
  frame++;
  bgOffset += speed;

  // speed ramp
  if (frame % 300 === 0) speed = Math.min(speed + 0.5, 12);

  // penguin physics
  const p = penguin;
  p.vy += GRAVITY;
  p.y += p.vy;

  if (p.y >= GROUND) {
    p.y = GROUND;
    p.vy = 0;
    p.onGround = true;
    p.jumps = 0;
  } else {
    p.onGround = false;
  }

  if (p.invincible > 0) p.invincible--;

  // spawn
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnObstacle();
    spawnTimer = Math.max(40, 100 - score * 0.5) | 0;
  }
  if (frame % 120 === 0) spawnFish();

  // obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed;
    if (o.type === 'ball') o.angle += speed * 0.08;
    if (o.x + o.w < 0) { obstacles.splice(i, 1); continue; }

    if (p.invincible === 0 && rectsOverlap(
      { x: p.x, y: p.y, w: p.w, h: p.h }, o
    )) {
      lives--;
      p.invincible = 90;
      spawnParticles(p.x + 22, p.y + 26, '#ff6b6b', 12);
      updateUI();
      if (lives <= 0) { gameOver(); return; }
    }
  }

  // fishes
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i];
    f.x -= speed;
    if (f.x + f.w < 0) { fishes.splice(i, 1); continue; }
    if (rectsOverlap({ x: p.x, y: p.y, w: p.w, h: p.h }, f, 4)) {
      score += 10;
      spawnParticles(f.x + 13, f.y + 9, '#ffd700', 8);
      fishes.splice(i, 1);
      updateUI();
    }
  }

  // score from survival
  if (frame % 10 === 0) { score++; updateUI(); }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.15;
    pt.life -= 0.04;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  for (const o of obstacles) {
    if (o.type === 'berg') drawIceberg(o);
    else if (o.type === 'ball') drawSnowball(o);
    else drawBird(o);
  }
  for (const f of fishes) drawFish(f);
  drawPenguin(penguin);
  drawParticles();
  drawHUD();
}

function gameOver() {
  state = 'dead';
  if (score > best) best = score;
  updateUI();

  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1 id="gameOverTitle">💀 게임 오버</h1>
    <div id="finalScore">점수: <strong>${score}</strong> &nbsp;|&nbsp; 최고: <strong>${best}</strong></div>
    <button id="startBtn" onclick="startGame()">다시 시작</button>
    <div class="hint">스페이스 / 클릭 / 탭으로도 재시작</div>
  `;
  ov.style.display = 'flex';
}

function loop() {
  if (state === 'playing') {
    update();
    draw();
  } else if (state === 'idle') {
    // idle animation
    frame++;
    bgOffset += 2;
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    // idle penguin
    penguin = penguin || { x: 100, y: GROUND, w: 44, h: 52, vy: 0, onGround: true, jumps: 0, invincible: 0 };
    drawPenguin(penguin);
  }
  requestAnimationFrame(loop);
}

// init idle state
initGame();
state = 'idle';
loop();
</script>
</body>
</html>
