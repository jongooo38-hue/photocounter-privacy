<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>슈퍼펭귄</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a1628;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
  overflow: hidden;
  user-select: none;
  touch-action: none;
}
#wrap {
  position: relative;
  width: 360px;
  height: 640px;
}
canvas {
  display: block;
  width: 360px;
  height: 640px;
  border-radius: 20px;
  box-shadow: 0 0 60px rgba(100,200,255,0.35);
}
#hud {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 14px 18px;
  pointer-events: none;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
#scoreBox {
  background: rgba(0,0,0,0.45);
  border-radius: 12px;
  padding: 6px 14px;
  color: #fff;
  font-size: 20px;
  font-weight: 700;
}
#livesBox {
  background: rgba(0,0,0,0.45);
  border-radius: 12px;
  padding: 6px 10px;
  font-size: 20px;
  letter-spacing: 3px;
}
#overlay {
  position: absolute;
  inset: 0;
  border-radius: 20px;
  background: rgba(5,15,35,0.82);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
#overlay h1 { font-size: 40px; color: #fff; text-shadow: 0 0 24px #5ce; }
.sub  { color: #adf; font-size: 15px; }
.hint { color: #6af; font-size: 13px; margin-top: 4px; text-align: center; line-height: 1.6; }
#startBtn {
  margin-top: 10px;
  padding: 14px 44px;
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg,#1e90ff,#0055cc);
  color: #fff;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 4px 24px rgba(30,144,255,.55);
  transition: transform .1s;
}
#startBtn:active { transform: scale(.95); }
#bestBox { color: #7fc; font-size: 15px; }
/* swipe controls overlay */
#ctrlLeft, #ctrlRight {
  position: absolute;
  top: 0; bottom: 0;
  width: 50%;
  opacity: 0;
  pointer-events: all;
}
#ctrlLeft  { left: 0; }
#ctrlRight { right: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="360" height="640"></canvas>
  <div id="hud">
    <div id="scoreBox">0</div>
    <div id="livesBox">🐧🐧🐧</div>
  </div>
  <div id="overlay">
    <h1>🐧 슈퍼펭귄</h1>
    <div class="sub">광고 없는 깨끗한 게임</div>
    <div id="bestBox">최고기록: 0</div>
    <div class="hint">← → / 스와이프 : 레인 이동<br>스페이스 / 탭 : 점프</div>
    <button id="startBtn" onclick="startGame()">게임 시작</button>
  </div>
  <div id="ctrlLeft"  onclick="moveLeft()"></div>
  <div id="ctrlRight" onclick="moveRight()"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 360, H = 640;

// ── constants ─────────────────────────────────────────────
const LANES    = [80, 180, 280];        // x centres of 3 lanes
const LANE_W   = 80;
const PENG_Y   = H - 110;
const GROUND_Y = H - 60;
const GRAVITY  = 0.7;
const JUMP_V   = -15;

// ── state ─────────────────────────────────────────────────
let state = 'idle';
let score, best = 0, lives, frame, speed;
let penguin, obstacles, fishes, particles, tileOffset;
let bgStars;
let touchStartX = null;

// ── init ──────────────────────────────────────────────────
function initGame() {
  score = 0; lives = 3; frame = 0; speed = 4; tileOffset = 0;
  penguin = {
    lane: 1, x: LANES[1], y: PENG_Y,
    vy: 0, onGround: true, jumps: 0,
    targetX: LANES[1], moving: false,
    invincible: 0, dead: false
  };
  obstacles = []; fishes = []; particles = [];
  bgStars = Array.from({length:30}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.5+0.5,
    twinkle: Math.random()*Math.PI*2
  }));
  updateHUD();
}

function updateHUD() {
  document.getElementById('scoreBox').textContent = score;
  const icons = Array(3).fill('🐧');
  for (let i = lives; i < 3; i++) icons[i] = '🩶';
  document.getElementById('livesBox').textContent = icons.join('');
  document.getElementById('bestBox').textContent = '최고기록: ' + best;
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  initGame();
  state = 'playing';
}

// ── controls ──────────────────────────────────────────────
function moveLeft()  { if (state!=='playing') return; if (penguin.lane>0) { penguin.lane--; penguin.targetX=LANES[penguin.lane]; } }
function moveRight() { if (state!=='playing') return; if (penguin.lane<2) { penguin.lane++; penguin.targetX=LANES[penguin.lane]; } }
function doJump()    {
  if (state==='idle'||state==='dead') { startGame(); return; }
  if (penguin.jumps < 2) {
    penguin.vy = penguin.jumps===0 ? JUMP_V : JUMP_V*0.8;
    penguin.onGround = false;
    penguin.jumps++;
    spawnParticles(penguin.x, penguin.y+30, '#aef', 6);
  }
}

document.addEventListener('keydown', e => {
  if (e.code==='ArrowLeft'  || e.key==='a') { e.preventDefault(); moveLeft(); }
  if (e.code==='ArrowRight' || e.key==='d') { e.preventDefault(); moveRight(); }
  if (e.code==='Space' || e.code==='ArrowUp') { e.preventDefault(); doJump(); }
});

// touch swipe
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
}, {passive:false});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) < 20) { doJump(); }
  else if (dx < 0) moveLeft();
  else moveRight();
  touchStartX = null;
}, {passive:false});

// ── spawn ─────────────────────────────────────────────────
let nextObstacle = 80, nextFish = 120;

function spawnRow() {
  // pick 1–2 blocked lanes
  const count = Math.random()<0.4 ? 2 : 1;
  const lanesCopy = [0,1,2].sort(()=>Math.random()-0.5);
  const blocked = lanesCopy.slice(0, count);
  for (const l of blocked) {
    const type = Math.random()<0.6 ? 'octo' : 'rock';
    obstacles.push({ lane:l, x:LANES[l], y:-60, w:50, h:50, type, angle:0 });
  }
}

function spawnFishRow() {
  const l = Math.floor(Math.random()*3);
  for (let i=0; i<3; i++) {
    fishes.push({ lane:l, x:LANES[l], y:-40 - i*36, w:24, h:16, bob:Math.random()*Math.PI*2, collected:false });
  }
}

function spawnParticles(x,y,color,n) {
  for (let i=0;i<n;i++) {
    particles.push({x,y,vx:(Math.random()-0.5)*5,vy:-Math.random()*5-1,life:1,color});
  }
}

// ── collision ─────────────────────────────────────────────
function rectsOverlap(ax,ay,aw,ah, bx,by,bw,bh, m=10) {
  return ax+m < bx+bw-m && ax+aw-m > bx+m &&
         ay+m < by+bh-m && ay+ah-m > by+m;
}

// ── draw helpers ──────────────────────────────────────────
function drawBg() {
  // ice track background
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#061428');
  grad.addColorStop(1,'#0d2a50');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // stars
  for (const s of bgStars) {
    s.twinkle += 0.03;
    ctx.globalAlpha = 0.4 + Math.sin(s.twinkle)*0.3;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // aurora
  ctx.save();
  ctx.globalAlpha = 0.08 + Math.sin(frame*0.01)*0.03;
  const ag = ctx.createLinearGradient(0,80,W,80);
  ag.addColorStop(0,'#00ffcc'); ag.addColorStop(0.5,'#aa44ff'); ag.addColorStop(1,'#00ffcc');
  ctx.fillStyle = ag;
  ctx.fillRect(0,60,W,80);
  ctx.restore();

  // 3 lanes (ice path)
  for (let l=0;l<3;l++) {
    const lx = LANES[l]-LANE_W/2;
    ctx.fillStyle = l===1 ? 'rgba(100,160,255,0.08)' : 'rgba(80,130,220,0.05)';
    ctx.fillRect(lx, 0, LANE_W, H);
    // lane line
    if (l<2) {
      ctx.save();
      ctx.globalAlpha = 0.2;
      ctx.strokeStyle = '#5af';
      ctx.setLineDash([18,22]);
      ctx.lineDashOffset = -tileOffset*0.8;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(LANES[l]+LANE_W/2, 0);
      ctx.lineTo(LANES[l]+LANE_W/2, H);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ground
  ctx.fillStyle = '#1a4a8a';
  ctx.fillRect(0, GROUND_Y, W, H-GROUND_Y);
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.strokeStyle = '#4af';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(W,GROUND_Y); ctx.stroke();
  ctx.restore();
}

function drawPenguin(p) {
  ctx.save();
  if (p.invincible>0 && Math.floor(frame/4)%2===0) ctx.globalAlpha = 0.35;

  const cx = p.x, cy = p.y;
  const bobX = p.onGround ? Math.sin(frame*0.25)*2 : 0;

  // shadow
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.ellipse(cx+bobX, GROUND_Y+4, 18, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // body
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();
  ctx.ellipse(cx+bobX, cy, 16, 22, 0, 0, Math.PI*2);
  ctx.fill();

  // belly
  ctx.fillStyle='#e8f4f8';
  ctx.beginPath();
  ctx.ellipse(cx+bobX, cy+3, 9, 14, 0, 0, Math.PI*2);
  ctx.fill();

  // head
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();
  ctx.arc(cx+bobX, cy-24, 13, 0, Math.PI*2);
  ctx.fill();

  // eye
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(cx+bobX+6, cy-26, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(cx+bobX+8, cy-25, 2.5, 0, Math.PI*2); ctx.fill();

  // beak
  ctx.fillStyle='#f4a300';
  ctx.beginPath();
  ctx.moveTo(cx+bobX+12, cy-22);
  ctx.lineTo(cx+bobX+20, cy-20);
  ctx.lineTo(cx+bobX+12, cy-18);
  ctx.closePath(); ctx.fill();

  // wings flap
  const wa = p.onGround ? Math.sin(frame*0.2)*0.5 : -0.8;
  ctx.fillStyle='#111f3a';
  ctx.save(); ctx.translate(cx+bobX-13,cy-5); ctx.rotate(wa);
  ctx.fillRect(-4,-5,8,20); ctx.restore();
  ctx.save(); ctx.translate(cx+bobX+13,cy-5); ctx.rotate(-wa);
  ctx.fillRect(-4,-5,8,20); ctx.restore();

  // feet
  ctx.fillStyle='#f4a300';
  const fOff = p.onGround ? Math.sin(frame*0.25)*4 : 0;
  ctx.fillRect(cx+bobX-14, cy+20+fOff, 10,5);
  ctx.fillRect(cx+bobX+4,  cy+20-fOff, 10,5);

  // helmet (decoration)
  ctx.fillStyle='#1e90ff';
  ctx.beginPath();
  ctx.arc(cx+bobX, cy-24, 13, Math.PI, 0);
  ctx.fill();
  // star on helmet
  ctx.fillStyle='#ffd700';
  drawStar(cx+bobX, cy-30, 5, 3, 4);

  ctx.restore();
}

function drawStar(cx,cy,outerR,innerR,points) {
  ctx.beginPath();
  for (let i=0;i<points*2;i++) {
    const r = i%2===0?outerR:innerR;
    const a = (i*Math.PI/points)-Math.PI/2;
    i===0?ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
  }
  ctx.closePath(); ctx.fill();
}

function drawOcto(o) {
  const cy = o.y;
  const cx = o.x;
  const bob = Math.sin(frame*0.12 + o.lane)*3;

  // tentacles
  ctx.fillStyle='#c0392b';
  for (let i=0;i<6;i++) {
    const tx = cx + (i-2.5)*8;
    const ty = cy+18+bob;
    ctx.beginPath();
    ctx.ellipse(tx, ty+12, 5, 10, (i-2.5)*0.15, 0, Math.PI*2);
    ctx.fill();
  }

  // body
  const bg = ctx.createRadialGradient(cx,cy+bob,2,cx,cy+bob,24);
  bg.addColorStop(0,'#e74c3c'); bg.addColorStop(1,'#922b21');
  ctx.fillStyle=bg;
  ctx.beginPath();
  ctx.ellipse(cx, cy+bob, 22, 20, 0, 0, Math.PI*2);
  ctx.fill();

  // head dome
  ctx.fillStyle='#c0392b';
  ctx.beginPath();
  ctx.ellipse(cx, cy-10+bob, 18, 14, 0, 0, Math.PI*2);
  ctx.fill();

  // eyes (angry)
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(cx-8,cy-8+bob,5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+8,cy-8+bob,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(cx-7,cy-7+bob,3,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+9,cy-7+bob,3,0,Math.PI*2); ctx.fill();
  // angry brow
  ctx.strokeStyle='#7b241c'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(cx-13,cy-14+bob); ctx.lineTo(cx-3,cy-11+bob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+13,cy-14+bob); ctx.lineTo(cx+3,cy-11+bob); ctx.stroke();
}

function drawRock(o) {
  ctx.save();
  ctx.fillStyle='#4a7fa5';
  ctx.beginPath();
  ctx.moveTo(o.x, o.y-24);
  ctx.lineTo(o.x-22, o.y+18);
  ctx.lineTo(o.x+22, o.y+18);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(o.x, o.y-24);
  ctx.lineTo(o.x+10, o.y);
  ctx.lineTo(o.x-5, o.y+5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawFish(f) {
  if (f.collected) return;
  const by = Math.sin(frame*0.1+f.bob)*3;
  ctx.save();
  ctx.translate(f.x, f.y+by);
  // tail
  ctx.fillStyle='#ffd700';
  ctx.beginPath();
  ctx.moveTo(-f.w/2-4,0); ctx.lineTo(-f.w/2+2,-6); ctx.lineTo(-f.w/2+2,6);
  ctx.closePath(); ctx.fill();
  // body
  ctx.beginPath();
  ctx.ellipse(2,0,f.w/2,f.h/2,0,0,Math.PI*2);
  ctx.fill();
  // shine
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.ellipse(4,-3,3,2,-0.3,0,Math.PI*2); ctx.fill();
  // eye
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(f.w/2-2,-1,2,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-3,p.y-3,6,6);
    ctx.restore();
  }
}

function drawDistanceBar() {
  // top progress indicator
  const pct = Math.min(score/2000, 1);
  ctx.save();
  ctx.globalAlpha=0.6;
  ctx.fillStyle='#223';
  ctx.fillRect(10,8,W-20,4);
  ctx.fillStyle='#4af';
  ctx.fillRect(10,8,(W-20)*pct,4);
  ctx.restore();
}

// ── game over ─────────────────────────────────────────────
function gameOver() {
  state='dead';
  if (score>best) best=score;
  updateHUD();
  const ov=document.getElementById('overlay');
  ov.innerHTML=`
    <h1 style="color:#ff6b6b;text-shadow:0 0 20px #f44">💀 게임 오버</h1>
    <div style="color:#fff;font-size:22px;font-weight:700;">점수: ${score}</div>
    <div id="bestBox" style="color:#7fc;font-size:16px;">최고기록: ${best}</div>
    <button id="startBtn" onclick="startGame()">다시 시작</button>
    <div class="hint">← → : 레인이동 &nbsp;|&nbsp; 스페이스/탭 : 점프</div>
  `;
  ov.style.display='flex';
}

// ── update ────────────────────────────────────────────────
function update() {
  frame++;
  tileOffset += speed;
  if (frame%240===0) speed = Math.min(speed+0.4, 14);

  const p = penguin;

  // smooth lane movement
  const dx = p.targetX - p.x;
  p.x += dx * 0.2;

  // jump physics
  p.vy += GRAVITY;
  p.y += p.vy;
  if (p.y >= PENG_Y) {
    p.y = PENG_Y; p.vy = 0; p.onGround=true; p.jumps=0;
  } else {
    p.onGround=false;
  }
  if (p.invincible>0) p.invincible--;

  // spawn obstacles
  nextObstacle--;
  if (nextObstacle<=0) {
    spawnRow();
    nextObstacle = Math.max(45, 100 - score*0.04)|0;
  }
  nextFish--;
  if (nextFish<=0) { spawnFishRow(); nextFish=90; }

  // move obstacles
  for (let i=obstacles.length-1;i>=0;i--) {
    const o=obstacles[i];
    o.y += speed;
    if (o.y > H+80) { obstacles.splice(i,1); continue; }
    if (p.invincible===0 && rectsOverlap(p.x-18,p.y-32,36,60, o.x-20,o.y-24,44,46)) {
      lives--;
      p.invincible=90;
      spawnParticles(p.x,p.y,'#ff6b6b',14);
      updateHUD();
      if (lives<=0) { gameOver(); return; }
    }
  }

  // move fishes
  for (let i=fishes.length-1;i>=0;i--) {
    const f=fishes[i];
    f.y += speed;
    if (f.y > H+40) { fishes.splice(i,1); continue; }
    if (!f.collected && rectsOverlap(p.x-18,p.y-32,36,60, f.x-12,f.y-8,24,16,4)) {
      f.collected=true;
      score+=10;
      spawnParticles(f.x,f.y,'#ffd700',8);
      fishes.splice(i,1);
      updateHUD();
    }
  }

  // survival score
  if (frame%8===0) { score++; updateHUD(); }

  // particles
  for (let i=particles.length-1;i>=0;i--) {
    const pt=particles[i];
    pt.x+=pt.vx; pt.y+=pt.vy; pt.vy+=0.2; pt.life-=0.04;
    if (pt.life<=0) particles.splice(i,1);
  }
}

// ── draw ─────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0,0,W,H);
  drawBg();
  for (const o of obstacles) {
    if (o.type==='octo') drawOcto(o);
    else drawRock(o);
  }
  for (const f of fishes) drawFish(f);
  drawPenguin(penguin);
  drawParticles();
  drawDistanceBar();
}

// ── idle loop ─────────────────────────────────────────────
function idleDraw() {
  frame++;
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawPenguin(penguin);
}

// ── main loop ─────────────────────────────────────────────
function loop() {
  if (state==='playing') { update(); draw(); }
  else idleDraw();
  requestAnimationFrame(loop);
}

initGame(); state='idle'; loop();
</script>
</body>
</html>
